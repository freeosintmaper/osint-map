name: Update Telegram Events

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build settlements database (if missing)
        run: |
          if [ ! -f data/settlements.js ] || [ $(stat -c%s data/settlements.js 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "Скачиваю GeoNames и строю базу населённых пунктов..."
            python3 scripts/build_settlements.py
          else
            echo "База уже есть:"
            wc -c data/settlements.js
          fi

      - name: Parse Telegram channels
        run: |
          mkdir -p data
          python3 scripts/parse_telegram.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Обновление событий и базы НП"
          git pull --rebase origin main
          git push
