name: Update War-Tracker Events

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch War-Tracker data
        run: |
          mkdir -p data
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               "https://war-tracker.com/api/v1/events?country=UA&limit=100" \
               -o data/war-tracker.json
          echo "Размер файла:"
          wc -c data/war-tracker.json
          head -c 200 data/war-tracker.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/war-tracker.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Обновление событий War-Tracker"
          git push
