name: Update War-Tracker Events

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch War-Tracker data for Ukraine
        run: |
          mkdir -p data
          for i in 1 2 3 4 5; do
            echo "=== UA попытка $i ==="
            curl -s -m 60 --retry 2 --retry-delay 5 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://war-tracker.com/api/v1/events?country=UA&limit=100" -o /tmp/ua.json
            SIZE=$(wc -c < /tmp/ua.json 2>/dev/null || echo 0)
            echo "Размер ответа: $SIZE байт"
            if [ "$SIZE" -gt 5000 ]; then
              echo "window.WT_DATA_UA = " > data/war-tracker-ua.js
              cat /tmp/ua.json >> data/war-tracker-ua.js
              echo ";" >> data/war-tracker-ua.js
              echo "✅ UA обновлён"
              exit 0
            fi
            echo "Не получилось, ждём 15 секунд..."
            sleep 15
          done
          echo "⚠️ UA не удалось после 5 попыток — оставляем старый файл"

      - name: Fetch War-Tracker data for Russia
        run: |
          mkdir -p data
          for i in 1 2 3 4 5; do
            echo "=== RU попытка $i ==="
            curl -s -m 60 --retry 2 --retry-delay 5 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://war-tracker.com/api/v1/events?country=RU&limit=100" -o /tmp/ru.json
            SIZE=$(wc -c < /tmp/ru.json 2>/dev/null || echo 0)
            echo "Размер ответа: $SIZE байт"
            if [ "$SIZE" -gt 5000 ]; then
              echo "window.WT_DATA_RU = " > data/war-tracker-ru.js
              cat /tmp/ru.json >> data/war-tracker-ru.js
              echo ";" >> data/war-tracker-ru.js
              echo "✅ RU обновлён"
              exit 0
            fi
            echo "Не получилось, ждём 15 секунд..."
            sleep 15
          done
          echo "⚠️ RU не удалось после 5 попыток — оставляем старый файл"

      - name: Download Leaflet libraries
        run: |
          mkdir -p lib/images
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" -o lib/leaflet.css
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" -o lib/leaflet.js
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" -o lib/images/marker-icon.png
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png" -o lib/images/marker-icon-2x.png
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png" -o lib/images/marker-shadow.png
          curl -sL "https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" -o lib/leaflet-draw.css
          curl -sL "https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js" -o lib/leaflet-draw.js
          curl -sL "https://unpkg.com/leaflet-draw@1.0.4/dist/images/spritesheet.png" -o lib/images/spritesheet.png
          curl -sL "https://unpkg.com/leaflet-draw@1.0.4/dist/images/spritesheet-2x.png" -o lib/images/spritesheet-2x.png
          curl -sL "https://unpkg.com/leaflet-draw@1.0.4/dist/images/spritesheet.svg" -o lib/images/spritesheet.svg
          curl -sL "https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js" -o lib/leaflet.polylineDecorator.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ lib/
          git diff --quiet && git diff --staged --quiet || git commit -m "Обновление данных и библиотек"
          git pull --rebase origin main
          git push
