name: Validate pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile scripts/parse_telegram.py scripts/classify_llm.py

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = Array.from(html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi));
          blocks.forEach((match, index) => {
            try {
              new Function(match[1]);
            } catch (error) {
              console.error('Inline script #' + (index + 1) + ' failed syntax validation:', error.message);
              process.exitCode = 1;
            }
          });
          if (!process.exitCode) console.log('Checked ' + blocks.length + ' inline script blocks.');
          NODE
