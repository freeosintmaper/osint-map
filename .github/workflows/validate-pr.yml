name: Validate pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile scripts/parse_telegram.py scripts/classify_llm.py scripts/backup_author_zones.py

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Function
        run: deno check supabase/functions/zone-assistant/index.ts

      - name: Test event location and verification logic
        run: python scripts/test_event_context_verification.py

      - name: Test author zones backup safety
        run: python scripts/test_backup_author_zones.py

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = Array.from(html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi));
          blocks.forEach((match, index) => {
            try {
              new Function(match[1]);
            } catch (error) {
              console.error('Inline script #' + (index + 1) + ' failed syntax validation:', error.message);
              process.exitCode = 1;
            }
          });
          if (!process.exitCode) console.log('Checked ' + blocks.length + ' inline script blocks.');
          NODE
