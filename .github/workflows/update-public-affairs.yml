name: Update public affairs news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_public_affairs.py"
      - ".github/workflows/update-public-affairs.yml"

permissions:
  contents: write

concurrency:
  group: public-affairs-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Collect non-military public-affairs headlines
        run: python scripts/update_public_affairs.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/public-affairs-news.json; then
            git add data/public-affairs-news.json
            git commit -m "chore: update public affairs news"
            git push
          else
            echo "No public-affairs feed changes."
          fi
