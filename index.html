<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>OSINT-карта</title>
  <link rel="stylesheet" href="./lib/leaflet.css" />
  <link rel="stylesheet" href="./lib/leaflet-draw.css" />
  <link rel="stylesheet" href="./lib/markercluster.css" />
  <link rel="stylesheet" href="./lib/markercluster.default.css" />
  <style>
    :root {
      --bg-panel: #ffffff; --bg-input: #f8f8f8; --bg-hover: #e8f0ff;
      --bg-summary: #f0f7ff; --text-main: #333333; --text-secondary: #666666;
      --text-muted: #999999; --border-light: #eeeeee; --border-mid: #dddddd;
      --border-soft: #f5f5f5; --shadow: rgba(0,0,0,0.25);
      --tooltip-bg: #333333; --tooltip-color: #ffffff;
    }
    body.dark {
      --bg-panel: #1e1e2e; --bg-input: #2a2a3a; --bg-hover: #3a3a5a;
      --bg-summary: #22223a; --text-main: #e0e0e0; --text-secondary: #b8b8b8;
      --text-muted: #888888; --border-light: #333344; --border-mid: #444455;
      --border-soft: #2a2a3a; --shadow: rgba(0,0,0,0.6);
      --tooltip-bg: #000000; --tooltip-color: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
           background: var(--bg-panel); overscroll-behavior: none; }
    #map { height: 100vh; height: 100dvh; width: 100%; }
    #errorBox {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #ffebee; color: #c62828; padding: 12px 20px;
      border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 13px; z-index: 99999; max-width: 90%; display: none;
    }

    #userBtn {
      position: fixed; top: 12px; left: 12px; z-index: 5000;
      width: 44px; height: 44px;
      background: var(--bg-panel); color: var(--text-main);
      border: 1px solid var(--border-mid); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.15s;
    }
    #userBtn:hover { background: var(--bg-hover); border-color: #0066ff; }
    #userBtn.logged-in { background: #0066ff; color: #fff; border-color: #0066ff; }
    #userBtn svg {
      width: 22px; height: 22px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    #loginOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 10000; display: none;
      align-items: center; justify-content: center;
    }
    #loginOverlay.open { display: flex; }
    #loginModal {
      background: var(--bg-panel); color: var(--text-main);
      border-radius: 12px; padding: 24px; width: 340px; max-width: 90vw;
      max-height: 85vh; overflow-y: auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      font-family: system-ui, sans-serif;
    }
    #loginModal h3 { margin: 0 0 16px; font-size: 18px; }
    #loginModal label {
      display: block; font-size: 12px; color: var(--text-secondary);
      margin-bottom: 4px;
    }
    #loginModal input[type="email"],
    #loginModal input[type="password"] {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid var(--border-mid); border-radius: 6px;
      background: var(--bg-input); color: var(--text-main);
      font-size: 14px;
    }
    #loginModal button {
      padding: 10px 16px; border-radius: 6px;
      border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      cursor: pointer; font-size: 14px; transition: all 0.15s;
    }
    #loginModal button.primary { background: #0066ff; color: #fff; border-color: #0066ff; }
    #loginModal button.danger { color: #c00; border-color: #f0c0c0; }
    #loginModal button:hover { opacity: 0.9; }
    #loginModal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    #loginModal .status {
      padding: 8px 12px; border-radius: 6px; font-size: 13px;
      margin-bottom: 12px;
    }
    #loginModal .status.err { background: #ffebee; color: #c62828; }
    #loginModal .status.ok { background: #e8f5e9; color: #2e7d32; }
    #loginModal .admin-info {
      padding: 12px; background: var(--bg-summary);
      border-radius: 6px; font-size: 13px; color: var(--text-secondary);
      margin-bottom: 12px;
    }
    #loginModal .admin-section {
      border-top: 1px solid var(--border-light);
      padding-top: 12px; margin-top: 12px;
    }
    #loginModal .admin-section h4 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
      color: var(--text-secondary);
    }
    #loginModal .full-btn {
      display: block; width: 100%; margin: 6px 0;
      text-align: left; padding: 10px 14px;
      background: var(--bg-input); border: 1px solid var(--border-mid);
      border-radius: 6px; cursor: pointer; font-size: 13px;
      color: var(--text-main); transition: all 0.15s;
    }
    #loginModal .full-btn:hover { background: var(--bg-hover); border-color: #0066ff; }

    #zoneEditorPanel {
      position: fixed; top: 66px; left: 66px; z-index: 6000;
      background: var(--bg-panel); color: var(--text-main);
      border-radius: 8px; padding: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      font-family: system-ui, sans-serif; font-size: 13px;
      width: 240px; display: none;
    }
    #zoneEditorPanel.open { display: block; }
    #zoneEditorPanel h4 {
      margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light); padding-bottom: 6px;
    }
    #zoneEditorPanel .cat-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; margin: 4px 0;
      border: 2px solid transparent; border-radius: 6px;
      background: var(--bg-input); cursor: pointer;
      font-size: 13px; color: var(--text-main);
      transition: all 0.15s;
    }
    #zoneEditorPanel .cat-btn:hover { background: var(--bg-hover); }
    #zoneEditorPanel .cat-btn.active { border-color: #0066ff; background: #eef5ff; }
    body.dark #zoneEditorPanel .cat-btn.active { background: #1a2a4a; }
    #zoneEditorPanel .swatch {
      width: 18px; height: 18px; border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.2);
    }
    #zoneEditorPanel .zone-actions {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }
    #zoneEditorPanel .zone-actions button {
      display: block; width: 100%; margin: 4px 0; padding: 8px;
      border: 1px solid var(--border-mid); background: var(--bg-input);
      color: var(--text-main); border-radius: 6px; cursor: pointer;
      font-size: 12px;
    }
    #zoneEditorPanel .zone-actions button:hover { background: var(--bg-hover); }
    #zoneEditorPanel .zone-actions button.danger { color: #c00; border-color: #f0c0c0; }
    #zoneEditorPanel .hint {
      margin-top: 8px; padding: 8px; background: var(--bg-summary);
      border-radius: 6px; font-size: 11px; color: var(--text-secondary);
      line-height: 1.4;
    }

    .control-panel {
      background: var(--bg-panel); color: var(--text-main);
      padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow); font-size: 13px;
      max-width: 280px; max-height: 90vh; overflow-y: auto;
    }
    .control-panel h4 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light); padding-bottom: 4px;
    }
    .control-panel label {
      display: flex; align-items: center; padding: 4px 0;
      cursor: pointer; font-size: 13px; gap: 6px;
    }
    .control-panel label input[type="checkbox"] { margin: 0; width: 15px; height: 15px; cursor: pointer; }
    .control-panel hr { border: none; border-top: 1px solid var(--border-light); margin: 10px 0; }
    .lang-switch { display: flex; gap: 4px; margin-bottom: 8px; }
    .lang-btn {
      flex: 1; padding: 4px 8px; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 4px; cursor: pointer; font-size: 12px; text-align: center; transition: all 0.2s;
    }
    .lang-btn.active { background: #0066ff; color: #fff; border-color: #0066ff; }
    .opacity-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .opacity-row label { flex: 0 0 auto; font-size: 12px; color: var(--text-secondary); }
    .opacity-row input[type="range"] { flex: 1; cursor: pointer; accent-color: #0066ff; }
    .opacity-row .opacity-value { flex: 0 0 42px; text-align: right; font-size: 12px; color: var(--text-secondary); }
    .mode-toggle { display: flex; gap: 4px; margin-top: 6px; }
    .mode-toggle button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    .mode-toggle button.active { background: #0066ff; color: #fff; border-color: #0066ff; }

    .info.legend {
      background: var(--bg-panel); color: var(--text-main);
      padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow); font-size: 12px;
      line-height: 1.6; max-width: 240px; max-height: 80vh; overflow-y: auto;
    }
    .info.legend h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; }
    .info.legend hr { border: none; border-top: 1px solid var(--border-light); margin: 8px 0; }
    .info.legend i { width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 2px; opacity: 0.85; border-radius: 3px; display: inline-block; }
    .info.legend .legend-line { width: 18px; height: 3px; float: left; margin-right: 8px; margin-top: 7px; border-radius: 2px; display: inline-block; }
    .info.legend .legend-svg { width: 16px; height: 16px; float: left; margin-right: 6px; margin-top: 2px; }
    .info.legend .legend-svg svg { width: 100%; height: 100%; }

    #eventsPanel {
      position: fixed; left: 66px; top: 10px; bottom: 100px;
      width: 280px; background: var(--bg-panel); color: var(--text-main);
      border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); z-index: 1000;
      display: flex; flex-direction: column; font-size: 13px;
    }
    #eventsPanel .panel-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border-light);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    #eventsPanel .panel-header .toggle-btn {
      cursor: pointer; font-size: 16px; color: var(--text-muted);
      background: none; border: none; padding: 0 4px;
    }
    #eventsPanel .panel-body { flex: 1; overflow-y: auto; padding: 6px 0; }
    #eventsPanel .event-item { padding: 8px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background 0.15s; }
    #eventsPanel .event-item:hover { background: var(--bg-hover); }
    #eventsPanel .event-item .evt-type { font-weight: 600; font-size: 12px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    #eventsPanel .event-item .evt-type svg { width: 14px; height: 14px; flex: 0 0 auto; }
    #eventsPanel .event-item .evt-loc { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
    #eventsPanel .event-item .evt-time { font-size: 10px; color: var(--text-muted); }
    #eventsPanel .event-item .evt-country { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto; font-weight: 600; }
    #eventsPanel .event-item .evt-country.ua { background: #e3f2fd; color: #1565c0; }
    #eventsPanel .event-item .evt-country.ru { background: #ffebee; color: #c62828; }
    #eventsPanel .event-item .evt-country.osint { background: #f0f0f0; color: #333; }
    #eventsPanel .summary-box { padding: 10px 14px; background: var(--bg-summary); border-bottom: 1px solid var(--border-light); font-size: 12px; }
    #eventsPanel .summary-box .summary-title { font-weight: 600; margin-bottom: 4px; }
    #eventsPanel .summary-box .summary-line { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-secondary); align-items: center; }
    #eventsPanel .summary-box .summary-line svg { width: 13px; height: 13px; margin-right: 6px; flex: 0 0 auto; }
    #eventsPanel.collapsed { width: 44px; }
    #eventsPanel.collapsed .panel-body,
    #eventsPanel.collapsed .panel-header span { display: none; }
    #eventsPanel.collapsed .panel-header .toggle-btn { display: block; }

    #toolbar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--bg-panel); border-radius: 8px; padding: 6px;
      box-shadow: 0 2px 8px var(--shadow); display: flex; gap: 4px; z-index: 1000;
      flex-wrap: wrap; justify-content: center;
    }
    #toolbar button {
      width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; transition: all 0.15s; position: relative;
    }
    #toolbar button:hover { background: var(--bg-hover); border-color: #0066ff; }
    #toolbar button.active { background: #0066ff; color: #fff; border-color: #0066ff; }
    #toolbar button.danger { color: #c00; border-color: #f0c0c0; }
    #toolbar button.donate-btn { color: #2e7d32; border-color: #a5d6a7; }
    #toolbar button .tooltip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: var(--tooltip-bg); color: var(--tooltip-color);
      padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s; margin-bottom: 6px;
      z-index: 9999;
    }
    #toolbar button:hover .tooltip { opacity: 1; }
    #toolbar .sep { width: 1px; background: var(--border-mid); margin: 4px 2px; flex: 0 0 auto; }
    #toolbar button svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
      display: block; pointer-events: none;
    }
    #toolbar button.active svg { stroke: #fff; }

    .event-icon {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    .event-icon svg { width: 16px; height: 16px; fill: #fff; display: block; pointer-events: none; }
    body.dark .event-icon { border-color: #1e1e2e; }

    .measure-tooltip {
      background: rgba(255, 0, 170, 0.95) !important;
      color: #fff !important;
      border: none !important;
      padding: 3px 8px !important;
      border-radius: 4px !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4) !important;
      white-space: nowrap !important;
    }
    .measure-tooltip::before { display: none !important; }

    body.dark .leaflet-control-zoom a { background: var(--bg-panel); color: var(--text-main); border-color: var(--border-mid); }
    body.dark .leaflet-popup-content-wrapper,
    body.dark .leaflet-popup-tip { background: var(--bg-panel); color: var(--text-main); }
    body.dark .leaflet-popup-content a { color: #6ba6ff; }

    @media (max-width: 768px) {
      #eventsPanel { left: 0; right: 0; top: 66px; bottom: 0; width: auto;
                     border-radius: 12px 12px 0 0; z-index: 4000; display: none; }
      body.show-events #eventsPanel { display: flex; }
      .control-panel { display: none; }
      body.show-filters .control-panel {
        display: block; position: fixed; left: 8px; right: 8px; top: 66px; bottom: 8px;
        max-width: none; max-height: none; z-index: 4000; overflow-y: auto;
      }
      .info.legend { display: none; }
      #toolbar { display: none; }
      body.show-tools #toolbar {
        display: flex; left: 8px; right: 8px; bottom: 8px; transform: none;
        max-width: none; padding: 8px; gap: 8px; border-radius: 12px;
        justify-content: center; flex-wrap: wrap; z-index: 4000;
      }
      #toolbar button { width: 52px; height: 52px; border-radius: 10px; }
      #toolbar button svg { width: 26px; height: 26px; }
      #toolbar button .tooltip { display: none; }
      #toolbar .sep { display: none; }
      .leaflet-control-zoom { display: none !important; }
      .event-icon { width: 36px; height: 36px; border-width: 2px; }
      .event-icon svg { width: 20px; height: 20px; }
      #mobileToggle { display: flex; }
      #userBtn { top: 10px; left: 10px; width: 48px; height: 48px; }
      #zoneEditorPanel { top: 66px; left: 8px; right: 8px; width: auto; }
    }

    #mobileToggle {
      display: none; position: fixed; top: 10px; right: 10px; z-index: 5000;
      gap: 8px;
    }
    #mobileToggle button {
      width: 48px; height: 48px;
      background: var(--bg-panel); color: var(--text-main);
      border: 1px solid var(--border-mid); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.15s;
    }
    #mobileToggle button.active { background: #0066ff; color: #fff; border-color: #0066ff; }
    #mobileToggle button svg {
      width: 24px; height: 24px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="errorBox"></div>

  <button id="userBtn" title="Вход для админа">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>

  <div id="loginOverlay">
    <div id="loginModal">
      <h3 id="loginModalTitle">Вход для админа</h3>
      <div id="loginStatus" style="display:none;"></div>
      <div id="loginFormBlock">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        <div class="row">
          <button id="btnLoginCancel">Отмена</button>
          <button id="btnLoginSubmit" class="primary">Войти</button>
        </div>
      </div>
      <div id="loginAdminBlock" style="display:none;">
        <div class="admin-info">✅ Вы вошли как админ.</div>
        <div class="admin-section">
          <h4>Зоны контроля</h4>
          <button class="full-btn" id="btnOpenZoneEditor">✏️ Редактировать зоны</button>
        </div>
        <div class="row" style="margin-top:12px;">
          <button id="btnLogout" class="danger">Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <div id="zoneEditorPanel">
    <h4>Что рисуем?</h4>
    <div class="cat-btn active" data-cat="russia">
      <div class="swatch" style="background:#cc0000;"></div>
      <div>Территория РФ</div>
    </div>
    <div class="cat-btn" data-cat="ukraine">
      <div class="swatch" style="background:#0055cc;"></div>
      <div>Территория Украины</div>
    </div>
    <div class="cat-btn" data-cat="grey">
      <div class="swatch" style="background:#888888;"></div>
      <div>Серая зона</div>
    </div>
    <div class="zone-actions">
      <button id="btnDrawZone">✏️ Нарисовать полигон</button>
      <button id="btnFinishZones">✅ Готово (закрыть)</button>
      <button id="btnClearAllZones" class="danger">🗑️ Удалить все зоны</button>
    </div>
    <div class="hint">
      Выбери категорию, нажми «Нарисовать полигон» и обведи территорию. Клик по первому узлу — завершить.
    </div>
  </div>

  <div id="mobileToggle">
    <button id="btnShowEvents" title="События">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button id="btnShowFilters" title="Фильтры">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button id="btnShowTools" title="Инструменты">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
    </button>
  </div>

  <div id="eventsPanel">
    <div class="panel-header">
      <span id="eventsPanelTitle">События</span>
      <button class="toggle-btn" id="toggleEventsPanel">◀</button>
    </div>
    <div class="panel-body" id="eventsListBody">
      <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">
        Загрузка событий...
      </div>
    </div>

    function buildAutoZones() {
      if (!window.TG_DATA || !window.TG_DATA.events) return;
      if (typeof turf === 'undefined') { console.warn('Turf.js не загружен'); return; }

      // Только боевые события
      var events = window.TG_DATA.events.filter(function(ev) {
        if (!ev.lat || !ev.lng) return false;
        return ['Military Strike', 'Military Operation', 'Military Offensive'].indexOf(ev.event_type) !== -1;
      });
      if (events.length < 5) { autoZonesLayer.clearLayers(); return; }

      // Сетка ~20 км (0.2 градуса)
      var gridSize = 0.2;
      var grid = {};
      events.forEach(function(ev) {
        var key = Math.floor(ev.lat / gridSize) + '_' + Math.floor(ev.lng / gridSize);
        if (!grid[key]) grid[key] = { count: 0, lat: 0, lng: 0 };
        grid[key].count++;
        grid[key].lat += ev.lat;
        grid[key].lng += ev.lng;
      });

      // Горячие ячейки (>= 2 событий)
      var hotspots = [];
      Object.keys(grid).forEach(function(k) {
        if (grid[k].count >= 2) {
          hotspots.push({
            count: grid[k].count,
            lat: grid[k].lat / grid[k].count,
            lng: grid[k].lng / grid[k].count
          });
        }
      });
      if (hotspots.length < 2) { autoZonesLayer.clearLayers(); return; }

      // Кластеризация hotspots (~50 км)
      var groups = [];
      hotspots.forEach(function(h) {
        var added = false;
        for (var i = 0; i < groups.length; i++) {
          var g = groups[i];
          var dlat = Math.abs(g.lat / g.count - h.lat);
          var dlng = Math.abs(g.lng / g.count - h.lng);
          if (dlat < 0.5 && dlng < 0.5) {
            g.count += h.count;
            g.lat += h.lat;
            g.lng += h.lng;
            g.points.push([h.lng, h.lat]);
            added = true;
            break;
          }
        }
        if (!added) {
          groups.push({ count: h.count, lat: h.lat, lng: h.lng, points: [[h.lng, h.lat]] });
        }
      });

      var features = [];
      groups.forEach(function(g) {
        if (g.points.length < 2) return;
        try {
          var fc = turf.featureCollection(g.points.map(function(p) { return turf.point(p); }));
          var hull = turf.convex(fc);
          if (!hull) {
            // Если точки на одной линии — обводим буфером каждую и объединяем
            var buffers = g.points.map(function(p) {
              return turf.buffer(turf.point(p), 20, { units: 'kilometers' });
            });
            if (buffers.length > 0) {
              var merged = buffers[0];
              for (var i = 1; i < buffers.length; i++) {
                try { merged = turf.union(merged, buffers[i]); } catch(e) {}
              }
              merged.properties = { density: g.count };
              features.push(merged);
            }
            return;
          }
          var buffered = turf.buffer(hull, 25, { units: 'kilometers' });
          buffered.properties = { density: g.count };
          features.push(buffered);
        } catch(e) { console.warn('Turf:', e.message); }
      });

      autoZonesLayer.clearLayers();
      if (features.length > 0) {
        autoZonesLayer.addData(turf.featureCollection(features));
        console.log('Автоматических зон: ' + features.length);
      }
    }

    function createEventIcon(eventType) {
      return L.divIcon({
        html: '<div class="event-icon" style="background:' + wtColor(eventType) + ';">' + wtSvg(eventType) + '</div>',
        className: '', iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -15]
      });
    }
    var activeEventTypes = {
      'Air Raid Alert': true, 'Military Strike': true, 'Military Operation': true,
      'Military Offensive': true, 'Security Incident': true, 'Political Development': false
    };

    var tgLayer = L.markerClusterGroup({
      showCoverageOnHover: false, maxClusterRadius: 60, spiderfyOnMaxZoom: true,
      spiderfyDistanceMultiplier: 5, zoomToBoundsOnClick: true, disableClusteringAtZoom: 13,
      iconCreateFunction: function(cluster) {
        var count = cluster.getChildCount();
        var size = count < 10 ? 44 : count < 100 ? 54 : 64;
        return L.divIcon({
          html: '<div style="width:' + size + 'px;height:' + size + 'px;background:rgba(0,102,255,0.78);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.4);">' + count + '</div>',
          className: '', iconSize: [size, size], iconAnchor: [size/2, size/2]
        });
      }
    });
    map.addLayer(tgLayer);

    function loadTelegramEvents() {
      if (!window.TG_DATA) {
        document.getElementById('eventsListBody').innerHTML =
          '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">Данные не подгрузились.</div>';
        return;
      }
      tgLayer.clearLayers();
      var list = (window.TG_DATA && window.TG_DATA.events) || [];
      var added = 0, panelEvents = [];

      list.forEach(function(ev) {
        if (!ev.lat || !ev.lng) return;
        if (!activeEventTypes[ev.event_type]) return;
        var marker = L.marker([ev.lat, ev.lng], { icon: createEventIcon(ev.event_type), riseOnHover: true });
        var label = t(WT_LABELS[ev.event_type] || ev.event_type);
        var dateStr = '';
        try { dateStr = new Date(ev.date).toLocaleString('ru-RU'); } catch(e) {}
        var countryLabel = ev.country === 'UA' ? t('countryUA') : (ev.country === 'RU' ? t('countryRU') : t('countryOSINT'));
        var countryClass = ev.country === 'UA' ? 'ua' : (ev.country === 'RU' ? 'ru' : 'osint');
        var badge = '<span class="evt-country ' + countryClass + '" style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;">' + countryLabel + '</span>';
        marker.bindPopup('<b>' + label + '</b> ' + badge + '<br><i>' + (ev.location || '') + '</i><br>' + (ev.description || '') + '<br><small>' + dateStr + '</small><br><small style="color:#888;">@' + (ev.channel || '') + '</small><br><a href="' + ev.url + '" target="_blank">' + t('source') + ' →</a>');
        tgLayer.addLayer(marker);
        added++;
        panelEvents.push(ev);
      });

      renderEventsPanel(panelEvents);
      // Автоматические зоны строим после загрузки событий
      buildAutoZones();
    }

    function renderEventsPanel(events) {
      var body = document.getElementById('eventsListBody');
      document.getElementById('eventsPanelTitle').textContent = t('eventsPanelTitle');
      if (!events || events.length === 0) {
        body.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">' + t('noEvents') + '</div>';
        return;
      }
      events.sort(function(a, b) { return (b.date ? new Date(b.date).getTime() : 0) - (a.date ? new Date(a.date).getTime() : 0); });
      var counts = {};
      events.forEach(function(ev) { counts[ev.event_type] = (counts[ev.event_type] || 0) + 1; });
      var html = '<div class="summary-box"><div class="summary-title">' + t('summaryTitle') + '</div>';
      Object.keys(counts).forEach(function(type) {
        html += '<div class="summary-line"><span style="display:flex;align-items:center;"><span style="color:' + wtColor(type) + ';display:flex;align-items:center;margin-right:6px;">' + wtSvg(type) + '</span>' + t(WT_LABELS[type] || type) + '</span><span>' + counts[type] + '</span></div>';
      });
      html += '<div class="summary-line" style="margin-top:4px;font-weight:600;"><span>' + t('total') + '</span><span>' + events.length + ' ' + t('eventsCount') + '</span></div></div>';
      events.slice(0, 100).forEach(function(ev) {
        var label = t(WT_LABELS[ev.event_type] || ev.event_type);
        var color = wtColor(ev.event_type);
        var time = '';
        try { time = new Date(ev.date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}
        var countryLabel = ev.country === 'UA' ? t('countryUA') : (ev.country === 'RU' ? t('countryRU') : t('countryOSINT'));
        var countryClass = ev.country === 'UA' ? 'ua' : (ev.country === 'RU' ? 'ru' : 'osint');
        html += '<div class="event-item" data-lat="' + ev.lat + '" data-lng="' + ev.lng + '">' +
                '<div class="evt-type" style="color:' + color + ';">' +
                '<span style="color:' + color + ';display:flex;align-items:center;">' + wtSvg(ev.event_type) + '</span>' + label +
                '<span class="evt-country ' + countryClass + '">' + countryLabel + '</span></div>' +
                '<div class="evt-loc">' + (ev.location || '') + ' <span style="color:#aaa;">@' + (ev.channel || '') + '</span></div>' +
                '<div class="evt-time">' + time + '</div></div>';
      });
      body.innerHTML = html;
      body.querySelectorAll('.event-item').forEach(function(item) {
        item.addEventListener('click', function() {
          var lat = parseFloat(this.getAttribute('data-lat'));
          var lng = parseFloat(this.getAttribute('data-lng'));
          if (!isNaN(lat) && !isNaN(lng)) { map.setView([lat, lng], 13); if (isMobile()) hideMobilePanels(); }
        });
      });
    }

    document.getElementById('toggleEventsPanel').addEventListener('click', function() {
      var panel = document.getElementById('eventsPanel');
      panel.classList.toggle('collapsed');
      this.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
    });

    function hideMobilePanels() {
      document.body.classList.remove('show-events', 'show-filters', 'show-tools', 'show-legend');
      ['btnShowEvents', 'btnShowFilters', 'btnShowTools'].forEach(function(id) {
        var el = document.getElementById(id); if (el) el.classList.remove('active');
      });
    }
    ['Events', 'Filters', 'Tools'].forEach(function(name) {
      var btn = document.getElementById('btnShow' + name);
      if (!btn) return;
      btn.addEventListener('click', function() {
        var cls = 'show-' + name.toLowerCase();
        var wasActive = document.body.classList.contains(cls);
        hideMobilePanels();
        if (!wasActive) { document.body.classList.add(cls); this.classList.add('active'); }
      });
    });
    map.on('click', function() { if (isMobile()) hideMobilePanels(); });

    // ============================================================
    // РЕДАКТОР ЗОН
    // ============================================================
    var currentZoneCategory = 'russia';
    var zoneDrawer = null;
    var zoneEditorPanel = document.getElementById('zoneEditorPanel');

    document.getElementById('btnOpenZoneEditor').addEventListener('click', function() {
      closeLoginModal();
      zoneEditorPanel.classList.add('open');
    });
    document.querySelectorAll('#zoneEditorPanel .cat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#zoneEditorPanel .cat-btn').forEach(function(el) { el.classList.remove('active'); });
        this.classList.add('active');
        currentZoneCategory = this.getAttribute('data-cat');
      });
    });
    document.getElementById('btnDrawZone').addEventListener('click', function() {
      if (zoneDrawer) { try { zoneDrawer.disable(); } catch(e) {} zoneDrawer = null; }
      zoneDrawer = new L.Draw.Polygon(map, {
        allowIntersection: false,
        shapeOptions: { color: zoneColors[currentZoneCategory].color, fillColor: zoneColors[currentZoneCategory].fillColor, fillOpacity: 0.3, weight: 2 }
      });
      zoneDrawer.enable();
    });
    document.getElementById('btnFinishZones').addEventListener('click', function() {
      if (zoneDrawer) { try { zoneDrawer.disable(); } catch(e) {} zoneDrawer = null; }
      zoneEditorPanel.classList.remove('open');
    });
    document.getElementById('btnClearAllZones').addEventListener('click', function() {
      if (!confirm('Удалить ВСЕ зоны контроля из базы?')) return;
      if (!sb) return;
      sb.from('control_zones').delete().neq('id', 0).then(function(res) {
        if (res.error) { alert('Ошибка: ' + res.error.message); return; }
        userZonesLayer.clearLayers();
        alert('Все зоны удалены');
      });
    });

    map.on(L.Draw.Event.CREATED, function(e) {
      if (!zoneEditorPanel.classList.contains('open')) return;
      var geometry = e.layer.toGeoJSON().geometry;
      if (sb) {
        sb.from('control_zones').insert({ category: currentZoneCategory, geometry: geometry }).then(function(res) {
          if (res.error) { alert('Ошибка: ' + res.error.message); return; }
          loadUserZones();
        });
      } else {
        userZonesLayer.addData({ type: 'Feature', properties: { category: currentZoneCategory }, geometry: geometry });
      }
      if (zoneDrawer) { try { zoneDrawer.disable(); } catch(e) {} zoneDrawer = null; }
    });

    // ============================================================
    // ТУЛБАР РИСОВАНИЯ
    // ============================================================
    var drawingsLayer = new L.FeatureGroup();
    map.addLayer(drawingsLayer);
    var currentDrawer = null, currentTool = null, lastMeasureLayer = null;

    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#toolbar button[data-tool]').forEach(function(btn) {
        if (btn.getAttribute('data-tool') === tool) btn.classList.add('active'); else btn.classList.remove('active');
      });
    }
    function deactivateDrawer() {
      if (currentDrawer) { try { currentDrawer.disable(); } catch(e) {} currentDrawer = null; }
      setActiveTool(null);
    }
    function activateTool(tool) {
      if (currentTool === tool) { deactivateDrawer(); return; }
      deactivateDrawer();
      setActiveTool(tool);
      var opts = { metric: true };
      if (tool === 'marker') currentDrawer = new L.Draw.Marker(map);
      else if (tool === 'line') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'arrow') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'polygon') currentDrawer = new L.Draw.Polygon(map, { metric: true });
      else if (tool === 'rectangle') currentDrawer = new L.Draw.Rectangle(map);
      else if (tool === 'circle') currentDrawer = new L.Draw.Circle(map, { metric: true });
      else if (tool === 'measure') currentDrawer = new L.Draw.Polyline(map, opts);
      if (currentDrawer) currentDrawer.enable();
    }

    map.on(L.Draw.Event.CREATED, function(e) {
      if (zoneEditorPanel.classList.contains('open')) return;
      var layer = e.layer, type = e.layerType, tool = currentTool;
      if (tool === 'measure') {
        if (lastMeasureLayer) drawingsLayer.removeLayer(lastMeasureLayer);
        if (layer.setStyle) layer.setStyle({ color: '#ff00aa', weight: 3, dashArray: '8,4' });
        var latlngs = layer.getLatLngs();
        if (latlngs.length > 0 && Array.isArray(latlngs[0])) latlngs = latlngs[0];
        var totalMeters = 0;
        for (var i = 1; i < latlngs.length; i++) totalMeters += latlngs[i-1].distanceTo(latlngs[i]);
        var text = totalMeters >= 1000 ? (totalMeters / 1000).toFixed(2) + ' км' : Math.round(totalMeters) + ' м';
        layer.bindTooltip(text, { permanent: true, direction: 'center', className: 'measure-tooltip' }).openTooltip();
        drawingsLayer.addLayer(layer); lastMeasureLayer = layer; saveDrawings(); deactivateDrawer(); return;
      }
      if (tool === 'arrow' && type === 'polyline') {
        var ll = layer.getLatLngs();
        if (ll.length > 0 && Array.isArray(ll[0])) ll = ll[0];
        if (ll.length >= 2) {
          if (layer.setStyle) layer.setStyle({ color: '#ff3366', weight: 3 });
          drawingsLayer.addLayer(layer);
          var decorator = L.polylineDecorator(layer, {
            patterns: [{ offset: '100%', repeat: 0,
              symbol: L.Symbol.arrowHead({ pixelSize: 15, polygon: false,
                pathOptions: { stroke: true, color: '#ff3366', weight: 3, fillOpacity: 1 } })
            }]
          });
          layer._arrowDecorator = decorator;
          drawingsLayer.addLayer(decorator);
          saveDrawings(); deactivateDrawer(); return;
        }
      }
      if (layer.setStyle) {
        if (type === 'polygon' || type === 'rectangle' || type === 'circle') {
          layer.setStyle({ color: '#9933ff', weight: 2, fill: true, fillColor: '#9933ff', fillOpacity: 0.2 });
        } else if (type === 'polyline' && tool !== 'measure') {
          layer.setStyle({ color: '#ff6600', weight: 3 });
        }
      }
      if (type === 'marker') layer.bindPopup('Метка');
      drawingsLayer.addLayer(layer); saveDrawings(); deactivateDrawer();
    });

    var DRAWINGS_KEY = 'osint_user_drawings';
    function saveDrawings() { try { localStorage.setItem(DRAWINGS_KEY, JSON.stringify(drawingsLayer.toGeoJSON())); } catch(e) {} }
    function loadDrawings() {
      try {
        var raw = localStorage.getItem(DRAWINGS_KEY);
        if (!raw) return;
        var geojson = JSON.parse(raw);
        drawingsLayer.clearLayers();
        L.geoJSON(geojson, {
          onEachFeature: function(feature, layer) {
            if (feature.geometry.type === 'Point') layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 2 });
            else if (feature.geometry.type === 'Polygon') layer.setStyle && layer.setStyle({ color: '#9933ff', weight: 2, fill: true, fillColor: '#9933ff', fillOpacity: 0.2 });
            else if (feature.geometry.type === 'LineString') {
              layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 3 });
              var ll = layer.getLatLngs();
              if (ll.length > 0 && Array.isArray(ll[0])) ll = ll[0];
              var tm = 0;
              for (var i = 1; i < ll.length; i++) tm += ll[i-1].distanceTo(ll[i]);
              var t2 = tm >= 1000 ? (tm / 1000).toFixed(2) + ' км' : Math.round(tm) + ' м';
              layer.bindTooltip(t2, { permanent: true, direction: 'center', className: 'measure-tooltip' }).openTooltip();
            }
            drawingsLayer.addLayer(layer);
          }
        });
      } catch(e) {}
    }

    function renderToolbar() {
      var toolbar = document.getElementById('toolbar');
      var themeIcon = currentTheme === 'dark' ? TOOLBAR_SVG.sun : TOOLBAR_SVG.moon;
      var tools = [
        { key: 'marker', svg: TOOLBAR_SVG.marker }, { key: 'line', svg: TOOLBAR_SVG.line },
        { key: 'arrow', svg: TOOLBAR_SVG.arrow }, { key: 'polygon', svg: TOOLBAR_SVG.polygon },
        { key: 'rectangle', svg: TOOLBAR_SVG.rectangle }, { key: 'circle', svg: TOOLBAR_SVG.circle },
        { sep: true }, { key: 'measure', svg: TOOLBAR_SVG.measure },
        { sep: true }, { key: 'clear', svg: TOOLBAR_SVG.clear, danger: true },
        { sep: true }, { key: 'theme', svg: themeIcon },
        { sep: true }, { key: 'info', svg: TOOLBAR_SVG.info },
        { sep: true }, { key: 'donate', svg: TOOLBAR_SVG.donate, donate: true }
      ];
      var html = '';
      tools.forEach(function(item) {
        if (item.sep) { html += '<div class="sep"></div>'; return; }
        var cls = item.danger ? 'danger' : (item.donate ? 'donate-btn' : '');
        var tooltip = t('tool' + item.key.charAt(0).toUpperCase() + item.key.slice(1));
        html += '<button data-tool="' + item.key + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + item.svg + '<span class="tooltip">' + tooltip + '</span></button>';
      });
      toolbar.innerHTML = html;
      toolbar.querySelectorAll('button[data-tool]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tool = this.getAttribute('data-tool');
          if (tool === 'clear') { if (confirm(t('clearConfirm'))) { drawingsLayer.clearLayers(); lastMeasureLayer = null; localStorage.removeItem(DRAWINGS_KEY); } return; }
          if (tool === 'theme') { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); return; }
          if (tool === 'info') { alert(t('aboutText')); return; }
          if (tool === 'donate') { window.open(DONATE_URL, '_blank'); return; }
          activateTool(tool);
        });
      });
    }
    renderToolbar();
    loadDrawings();

    // ============================================================
    // ПАНЕЛЬ ФИЛЬТРОВ
    // ============================================================
    var panel = L.control({ position: 'topright' });
    panel.onAdd = function() {
      var div = L.DomUtil.create('div', 'control-panel');
      function render() {
        var html = '';
        html += '<div class="lang-switch">' +
                '<button class="lang-btn' + (currentLang === 'ru' ? ' active' : '') + '" data-lang="ru">RU</button>' +
                '<button class="lang-btn' + (currentLang === 'uk' ? ' active' : '') + '" data-lang="uk">UA</button>' +
                '<button class="lang-btn' + (currentLang === 'en' ? ' active' : '') + '" data-lang="en">EN</button></div>';
        html += '<h4>' + t('controlZones') + '</h4>';
        html += '<label><input type="checkbox" id="chkZone" checked> ' + t('territoryRF') + '</label>';
        html += '<label><input type="checkbox" id="chkCounter" checked> ' + t('counteroffensive') + '</label>';
        html += '<label><input type="checkbox" id="chkAutoZones" checked> ' + t('autoZones') + '</label>';
        html += '<label><input type="checkbox" id="chkUserZones" checked> ' + t('userZones') + '</label>';
        html += '<hr><h4>' + t('telegramEvents') + '</h4>';
        html += '<label><input type="checkbox" id="chkTg" checked> ' + t('eventsPanelTitle') + '</label>';
        [
          { key: 'Air Raid Alert', label: t('raidAlert') },
          { key: 'Military Strike', label: t('strike') },
          { key: 'Military Operation', label: t('operation') },
          { key: 'Military Offensive', label: t('offensive') },
          { key: 'Security Incident', label: t('incident') },
          { key: 'Political Development', label: t('politics') }
        ].forEach(function(item) {
          html += '<label><input type="checkbox" class="wt-filter" data-type="' + item.key + '"' + (activeEventTypes[item.key] ? ' checked' : '') + '> <span style="color:' + wtColor(item.key) + ';display:inline-flex;align-items:center;width:16px;height:16px;">' + wtSvg(item.key) + '</span> ' + item.label + '</label>';
        });
        html += '<hr>';
        html += '<div class="opacity-row"><label>' + t('opacityLabel') + '</label><input type="range" id="opacitySlider" min="0" max="50" step="1" value="' + Math.round(fillOpacity * 100) + '"><span class="opacity-value" id="opacityValue">' + Math.round(fillOpacity * 100) + '%</span></div>';
        html += '<div class="mode-toggle"><button data-mode="fill" class="' + (layerMode === 'fill' ? 'active' : '') + '">' + t('modeFill') + '</button><button data-mode="outline" class="' + (layerMode === 'outline' ? 'active' : '') + '">' + t('modeOutline') + '</button></div>';
        div.innerHTML = html;
        attach();
      }
      function attach() {
        div.querySelectorAll('.lang-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentLang = this.getAttribute('data-lang');
            render(); updateLegend(); renderToolbar(); loadTelegramEvents();
          });
        });
        var chkZone = div.querySelector('#chkZone');
        if (chkZone) chkZone.addEventListener('change', function() {
          if (this.checked) deepStateLayer.addTo(map); else map.removeLayer(deepStateLayer);
        });
        var chkCounter = div.querySelector('#chkCounter');
        if (chkCounter) chkCounter.addEventListener('change', function() {
          if (this.checked) counterLayer.addTo(map); else map.removeLayer(counterLayer);
        });
        var chkAuto = div.querySelector('#chkAutoZones');
        if (chkAuto) chkAuto.addEventListener('change', function() {
          if (this.checked) autoZonesLayer.addTo(map); else map.removeLayer(autoZonesLayer);
        });
        var chkUser = div.querySelector('#chkUserZones');
        if (chkUser) chkUser.addEventListener('change', function() {
          if (this.checked) userZonesLayer.addTo(map); else map.removeLayer(userZonesLayer);
        });
        var chkTg = div.querySelector('#chkTg');
        if (chkTg) chkTg.addEventListener('change', function() {
          if (this.checked) map.addLayer(tgLayer); else map.removeLayer(tgLayer);
        });
        var slider = div.querySelector('#opacitySlider');
        var sliderValue = div.querySelector('#opacityValue');
        if (slider) slider.addEventListener('input', function() {
          fillOpacity = parseInt(this.value, 10) / 100;
          sliderValue.textContent = this.value + '%';
          refreshAllStyles(); saveSettings();
        });
        div.querySelectorAll('.mode-toggle button').forEach(function(btn) {
          btn.addEventListener('click', function() {
            layerMode = this.getAttribute('data-mode');
            div.querySelectorAll('.mode-toggle button').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            refreshAllStyles(); saveSettings();
          });
        });
        div.querySelectorAll('.wt-filter').forEach(function(chk) {
          chk.addEventListener('change', function() {
            activeEventTypes[this.getAttribute('data-type')] = this.checked;
            loadTelegramEvents();
          });
        });
      }
      render();
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    panel.addTo(map);

    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      var div = L.DomUtil.create('div', 'info legend');
      updateLegendInDiv(div);
      return div;
    };
    legend.addTo(map);
    function updateLegend() { var div = document.querySelector('.info.legend'); if (div) updateLegendInDiv(div); }
    function updateLegendInDiv(div) {
      var html = '<h4>' + t('controlZones') + '</h4>';
      html += '<div><i style="background:#cc0000;"></i> ' + t('territoryRF') + '</div>';
      html += '<div><span class="legend-line" style="background:#0088cc;"></span> ' + t('counteroffensive') + '</div>';
      html += '<div><i style="background:#ff6600;"></i> ' + t('autoZones') + '</div>';
      html += '<hr><h4>' + t('telegramEvents') + '</h4>';
      ['Air Raid Alert','Military Strike','Military Operation','Military Offensive','Security Incident','Political Development'].forEach(function(type) {
        html += '<div><span class="legend-svg" style="color:' + wtColor(type) + ';">' + wtSvg(type) + '</span> ' + t(WT_LABELS[type]) + '</div>';
      });
      html += '<hr><div style="font-size:11px;color:var(--text-muted);">Telegram · DeepStateMap · ISW · Turf</div>';
      div.innerHTML = html;
    }

    loadTelegramEvents();
  </script>
</body>
</html>
