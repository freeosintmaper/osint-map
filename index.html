<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>OSINT-карта</title>
  <link rel="stylesheet" href="./lib/leaflet.css" />
  <link rel="stylesheet" href="./lib/leaflet-draw.css" />
  <style>
    :root {
      --bg-panel: #ffffff; --bg-input: #f8f8f8; --bg-hover: #e8f0ff;
      --bg-summary: #f0f7ff; --text-main: #333333; --text-secondary: #666666;
      --text-muted: #999999; --border-light: #eeeeee; --border-mid: #dddddd;
      --border-soft: #f5f5f5; --shadow: rgba(0,0,0,0.25);
      --tooltip-bg: #333333; --tooltip-color: #ffffff;
    }
    body.dark {
      --bg-panel: #1e1e2e; --bg-input: #2a2a3a; --bg-hover: #3a3a5a;
      --bg-summary: #22223a; --text-main: #e0e0e0; --text-secondary: #b8b8b8;
      --text-muted: #888888; --border-light: #333344; --border-mid: #444455;
      --border-soft: #2a2a3a; --shadow: rgba(0,0,0,0.6);
      --tooltip-bg: #000000; --tooltip-color: #ffffff;
    }

    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg-panel); }
    #map { height: 100vh; width: 100%; }
    #errorBox {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #ffebee; color: #c62828; padding: 12px 20px;
      border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 13px; z-index: 99999; max-width: 90%; display: none;
    }
    #errorBox.info { background: #e3f2fd; color: #1565c0; }

    .event-icon {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.45);
      transition: transform 0.15s; cursor: pointer;
    }
    .event-icon svg { width: 16px; height: 16px; fill: #fff; display: block; pointer-events: none; }
    .event-icon:hover { transform: scale(1.18); z-index: 1000; }
    body.dark .event-icon { border-color: #1e1e2e; }

    .control-panel {
      background: var(--bg-panel); color: var(--text-main);
      padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow); font-size: 13px;
      max-width: 280px; max-height: 90vh; overflow-y: auto;
    }
    .control-panel h4 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light); padding-bottom: 4px;
    }
    .control-panel label {
      display: flex; align-items: center; padding: 4px 0;
      cursor: pointer; font-size: 13px; gap: 6px;
    }
    .control-panel label input[type="checkbox"] { margin: 0; width: 15px; height: 15px; cursor: pointer; }
    .control-panel hr { border: none; border-top: 1px solid var(--border-light); margin: 10px 0; }
    .lang-switch { display: flex; gap: 4px; margin-bottom: 8px; }
    .lang-btn {
      flex: 1; padding: 4px 8px; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 4px; cursor: pointer; font-size: 12px; text-align: center; transition: all 0.2s;
    }
    .lang-btn.active { background: #0066ff; color: #fff; border-color: #0066ff; }

    .opacity-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .opacity-row label { flex: 0 0 auto; font-size: 12px; color: var(--text-secondary); }
    .opacity-row input[type="range"] { flex: 1; cursor: pointer; accent-color: #0066ff; }
    .opacity-row .opacity-value { flex: 0 0 42px; text-align: right; font-size: 12px; color: var(--text-secondary); }
    .mode-toggle { display: flex; gap: 4px; margin-top: 6px; }
    .mode-toggle button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    .mode-toggle button.active { background: #0066ff; color: #fff; border-color: #0066ff; }

    .info.legend {
      background: var(--bg-panel); color: var(--text-main);
      padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow); font-size: 12px;
      line-height: 1.6; max-width: 240px; max-height: 80vh; overflow-y: auto;
    }
    .info.legend h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; }
    .info.legend hr { border: none; border-top: 1px solid var(--border-light); margin: 8px 0; }
    .info.legend i { width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 2px; opacity: 0.85; border-radius: 3px; display: inline-block; }
    .info.legend .legend-line { width: 18px; height: 3px; float: left; margin-right: 8px; margin-top: 7px; border-radius: 2px; display: inline-block; }
    .info.legend .legend-svg { width: 16px; height: 16px; float: left; margin-right: 6px; margin-top: 2px; }
    .info.legend .legend-svg svg { width: 100%; height: 100%; }

    #eventsPanel {
      position: fixed; left: 10px; top: 10px; bottom: 100px;
      width: 280px; background: var(--bg-panel); color: var(--text-main);
      border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); z-index: 1000;
      display: flex; flex-direction: column; font-size: 13px;
    }
    #eventsPanel .panel-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border-light);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    #eventsPanel .panel-header .toggle-btn {
      cursor: pointer; font-size: 16px; color: var(--text-muted);
      background: none; border: none; padding: 0 4px;
    }
    #eventsPanel .panel-body { flex: 1; overflow-y: auto; padding: 6px 0; }
    #eventsPanel .event-item { padding: 8px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background 0.15s; }
    #eventsPanel .event-item:hover { background: var(--bg-hover); }
    #eventsPanel .event-item .evt-type { font-weight: 600; font-size: 12px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    #eventsPanel .event-item .evt-type svg { width: 14px; height: 14px; flex: 0 0 auto; }
    #eventsPanel .event-item .evt-loc { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
    #eventsPanel .event-item .evt-time { font-size: 10px; color: var(--text-muted); }
    #eventsPanel .event-item .evt-country { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto; font-weight: 600; }
    #eventsPanel .event-item .evt-country.ua { background: #e3f2fd; color: #1565c0; }
    #eventsPanel .event-item .evt-country.ru { background: #ffebee; color: #c62828; }
    #eventsPanel .event-item .evt-country.osint { background: #f0f0f0; color: #333; }
    #eventsPanel .summary-box { padding: 10px 14px; background: var(--bg-summary); border-bottom: 1px solid var(--border-light); font-size: 12px; }
    #eventsPanel .summary-box .summary-title { font-weight: 600; margin-bottom: 4px; }
    #eventsPanel .summary-box .summary-line { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-secondary); align-items: center; }
    #eventsPanel .summary-box .summary-line svg { width: 13px; height: 13px; margin-right: 6px; flex: 0 0 auto; }
    #eventsPanel.collapsed { width: 40px; }
    #eventsPanel.collapsed .panel-body,
    #eventsPanel.collapsed .panel-header span { display: none; }
    #eventsPanel.collapsed .panel-header .toggle-btn { display: block; }

    #toolbar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--bg-panel); border-radius: 8px; padding: 6px;
      box-shadow: 0 2px 8px var(--shadow); display: flex; gap: 4px; z-index: 1000;
      max-width: calc(100vw - 20px); overflow-x: auto;
    }
    #toolbar button {
      width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--border-mid);
      background: var(--bg-input); color: var(--text-main);
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; transition: all 0.15s; position: relative;
    }
    #toolbar button:hover { background: var(--bg-hover); border-color: #0066ff; }
    #toolbar button.active { background: #0066ff; color: #fff; border-color: #0066ff; }
    #toolbar button.danger { color: #c00; border-color: #f0c0c0; }
    #toolbar button.danger:hover { background: #fee; }
    #toolbar button .tooltip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: var(--tooltip-bg); color: var(--tooltip-color);
      padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s; margin-bottom: 6px;
    }
    #toolbar button:hover .tooltip { opacity: 1; }
    #toolbar .sep { width: 1px; background: var(--border-mid); margin: 4px 2px; flex: 0 0 auto; }
    #toolbar button svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
      display: block; pointer-events: none;
    }
    #toolbar button.active svg { stroke: #fff; }

    body.dark .leaflet-control-zoom a { background: var(--bg-panel); color: var(--text-main); border-color: var(--border-mid); }
    body.dark .leaflet-control-zoom a:hover { background: var(--bg-hover); }
    body.dark .leaflet-popup-content-wrapper,
    body.dark .leaflet-popup-tip { background: var(--bg-panel); color: var(--text-main); }
    body.dark .leaflet-popup-content a { color: #6ba6ff; }

    @media (max-width: 768px) {
      .control-panel { max-width: 220px; font-size: 12px; padding: 8px 10px; max-height: 70vh; }
      .control-panel h4 { font-size: 11px; }
      .control-panel label { font-size: 12px; padding: 3px 0; }
      .info.legend { max-width: 180px; font-size: 11px; padding: 8px 10px; max-height: 50vh; }
      #eventsPanel { width: 220px; bottom: 90px; top: 8px; left: 8px; font-size: 12px; }
      #eventsPanel .panel-header { padding: 8px 10px; font-size: 12px; }
      #eventsPanel .event-item { padding: 6px 10px; }
      #toolbar { padding: 4px; bottom: 10px; gap: 3px; }
      #toolbar button { width: 36px; height: 36px; }
      #toolbar .sep { margin: 2px 1px; }
      #toolbar button .tooltip { display: none; }
      #toolbar button svg { width: 17px; height: 17px; }
      .event-icon { width: 26px; height: 26px; border-width: 1.5px; }
      .event-icon svg { width: 14px; height: 14px; }
    }

    @media (max-width: 480px) {
      #eventsPanel { width: 180px; }
      #eventsPanel.collapsed { width: 36px; }
      .control-panel { max-width: 180px; }
      .info.legend { max-width: 140px; font-size: 10px; }
      .info.legend i, .info.legend .legend-line { width: 10px; height: 10px; margin-top: 1px; }
      #toolbar button { width: 32px; height: 32px; }
      #toolbar button svg { width: 15px; height: 15px; }
      .event-icon { width: 24px; height: 24px; }
      .event-icon svg { width: 12px; height: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="errorBox"></div>

  <div id="eventsPanel">
    <div class="panel-header">
      <span id="eventsPanelTitle">События из Telegram</span>
      <button class="toggle-btn" id="toggleEventsPanel">◀</button>
    </div>
    <div class="panel-body" id="eventsListBody">
      <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">
        Загрузка событий...
      </div>
    </div>
  </div>

  <div id="toolbar"></div>

  <script>
    window.addEventListener('error', function(e) {
      var box = document.getElementById('errorBox');
      if (box) { box.style.display = 'block'; box.textContent = 'Ошибка: ' + e.message; }
    });
  </script>

  <!-- Данные Telegram, потом библиотеки, потом код -->
  <script src="./data/telegram-events.js"></script>
  <script src="./lib/leaflet.js"></script>
  <script src="./lib/leaflet-draw.js"></script>
  <script src="./lib/leaflet.polylineDecorator.js"></script>

  <script>
    // ============================================================
    // 1. НАСТРОЙКИ
    // ============================================================
    var i18n = {
      ru: {
        eventsPanelTitle: 'События из Telegram',
        controlZones: 'Зоны контроля',
        territoryRF: 'Территория, занимаемая РФ (DeepStateMap)',
        counteroffensive: 'Контрнаступления ВСУ (ISW)',
        telegramEvents: 'События из Telegram',
        raidAlert: 'Воздушная тревога', strike: 'Удар', operation: 'Операция',
        offensive: 'Наступление', incident: 'Инцидент', politics: 'Политика',
        summaryTitle: 'Сводка', eventsCount: 'событий',
        noEvents: 'Нет событий', source: 'Источник',
        toolMarker: 'Метка', toolLine: 'Линия', toolArrow: 'Стрелка',
        toolPolygon: 'Зона', toolRectangle: 'Прямоугольник', toolCircle: 'Круг',
        toolMeasure: 'Измерить расстояние', toolClear: 'Очистить всё',
        toolTheme: 'Тёмная тема', toolInfo: 'О проекте',
        clearConfirm: 'Удалить все ваши рисунки?',
        total: 'Всего', countryUA: 'Украина', countryRU: 'РФ', countryOSINT: 'OSINT',
        opacityLabel: 'Прозрачность', modeFill: 'Заливка', modeOutline: 'Только контуры',
        aboutText: 'Карта агрегирует открытые данные.\n\n' +
                   '· События — публичные Telegram-каналы\n' +
                   '· Территория РФ — DeepStateMap\n' +
                   '· Контрнаступления — ISW\n\n' +
                   'Мы не проводим собственный анализ. ' +
                   'Линия фронта — приблизительная.'
      },
      uk: {
        eventsPanelTitle: 'Події з Telegram',
        controlZones: 'Зони контролю',
        territoryRF: 'Територія, яку займає РФ (DeepStateMap)',
        counteroffensive: 'Контрнаступи ЗСУ (ISW)',
        telegramEvents: 'Події з Telegram',
        raidAlert: 'Повітряна тривога', strike: 'Удар', operation: 'Операція',
        offensive: 'Наступ', incident: 'Інцидент', politics: 'Політика',
        summaryTitle: 'Зведення', eventsCount: 'подій',
        noEvents: 'Немає подій', source: 'Джерело',
        toolMarker: 'Мітка', toolLine: 'Лінія', toolArrow: 'Стрілка',
        toolPolygon: 'Зона', toolRectangle: 'Прямокутник', toolCircle: 'Коло',
        toolMeasure: 'Виміряти відстань', toolClear: 'Очистити все',
        toolTheme: 'Темна тема', toolInfo: 'Про проект',
        clearConfirm: 'Видалити всі ваші малюнки?',
        total: 'Всього', countryUA: 'Україна', countryRU: 'РФ', countryOSINT: 'OSINT',
        opacityLabel: 'Прозорість', modeFill: 'Заливка', modeOutline: 'Лише контури',
        aboutText: 'Карта агрегує відкриті дані.'
      },
      en: {
        eventsPanelTitle: 'Telegram Events',
        controlZones: 'Control Zones',
        territoryRF: 'Territory held by RF (DeepStateMap)',
        counteroffensive: 'Ukrainian counteroffensives (ISW)',
        telegramEvents: 'Telegram Events',
        raidAlert: 'Air Raid Alert', strike: 'Strike', operation: 'Operation',
        offensive: 'Offensive', incident: 'Incident', politics: 'Politics',
        summaryTitle: 'Summary', eventsCount: 'events',
        noEvents: 'No events', source: 'Source',
        toolMarker: 'Marker', toolLine: 'Line', toolArrow: 'Arrow',
        toolPolygon: 'Polygon', toolRectangle: 'Rectangle', toolCircle: 'Circle',
        toolMeasure: 'Measure distance', toolClear: 'Clear all',
        toolTheme: 'Dark theme', toolInfo: 'About',
        clearConfirm: 'Delete all your drawings?',
        total: 'Total', countryUA: 'Ukraine', countryRU: 'RF', countryOSINT: 'OSINT',
        opacityLabel: 'Opacity', modeFill: 'Fill', modeOutline: 'Outline only',
        aboutText: 'This map aggregates open data.'
      }
    };

    var currentLang = 'ru';
    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || (i18n.ru[key]) || key;
    }

    var OPACITY_KEY = 'osint_opacity';
    var MODE_KEY = 'osint_mode';
    var THEME_KEY = 'osint_theme';

    var fillOpacity = parseFloat(localStorage.getItem(OPACITY_KEY) || '0.15');
    var layerMode = localStorage.getItem(MODE_KEY) || 'fill';
    var currentTheme = localStorage.getItem(THEME_KEY) || 'light';

    function saveSettings() {
      localStorage.setItem(OPACITY_KEY, fillOpacity.toString());
      localStorage.setItem(MODE_KEY, layerMode);
    }

    function styleFor(baseColor) {
      if (layerMode === 'outline') {
        return { color: baseColor, weight: 1.8, opacity: 0.9, fill: false, fillColor: baseColor, fillOpacity: 0 };
      }
      return { color: baseColor, weight: 1.2, opacity: 0.9, fill: true, fillColor: baseColor, fillOpacity: fillOpacity };
    }

    function applyStyleToLayer(layer, baseColor, styleObj) {
      if (!layer) return;
      if (layer.setStyle) layer.setStyle(styleObj);
      if (layer.options) {
        layer.options.fill = styleObj.fill;
        layer.options.fillColor = styleObj.fillColor;
        layer.options.fillOpacity = styleObj.fillOpacity;
        layer.options.color = styleObj.color;
        layer.options.weight = styleObj.weight;
        layer.options.opacity = styleObj.opacity;
      }
      if (layer.redraw) layer.redraw();
    }

    function refreshAllStyles() {
      if (deepStateLayer) {
        deepStateLayer.eachLayer(function(sub) {
          applyStyleToLayer(sub, '#cc0000', styleFor('#cc0000'));
        });
      }
      if (counterLayer) {
        counterLayer.eachLayer(function(sub) {
          applyStyleToLayer(sub, '#0088cc', {
            color: '#0088cc', weight: 2, opacity: 0.85,
            fill: false, fillColor: '#0088cc', fillOpacity: 0, dashArray: '5,5'
          });
        });
      }
    }

    var TOOLBAR_SVG = {
      marker: '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
      line: '<svg viewBox="0 0 24 24"><path d="M4 19L20 5"/></svg>',
      arrow: '<svg viewBox="0 0 24 24"><path d="M4 12h13M12 6l6 6-6 6"/></svg>',
      polygon: '<svg viewBox="0 0 24 24"><path d="M12 2l9 7-3.5 11h-11L3 9z"/></svg>',
      rectangle: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></svg>',
      circle: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
      measure: '<svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>',
      clear: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
      moon: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>',
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
      info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
    };

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem(THEME_KEY, theme);
      if (theme === 'dark') {
        document.body.classList.add('dark');
        map.removeLayer(lightTile); darkTile.addTo(map);
      } else {
        document.body.classList.remove('dark');
        map.removeLayer(darkTile); lightTile.addTo(map);
      }
      var btn = document.querySelector('#toolbar button[data-tool="theme"]');
      if (btn) {
        var themeSvg = theme === 'dark' ? TOOLBAR_SVG.sun : TOOLBAR_SVG.moon;
        btn.innerHTML = themeSvg + '<span class="tooltip">' + t('toolTheme') + '</span>';
      }
    }

    // ============================================================
    // 2. КАРТА
    // ============================================================
    var map = L.map('map', { zoomControl: false }).setView([48.5, 37.5], 7);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    var lightTile = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri', maxZoom: 19 }
    );
    var darkTile = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri', maxZoom: 16 }
    );

    if (currentTheme === 'dark') {
      darkTile.addTo(map); document.body.classList.add('dark');
    } else {
      lightTile.addTo(map);
    }

    // ============================================================
    // 3. СЛОИ КОНТРОЛЯ
    // ============================================================
    function polygonPopup(text) {
      return function(f, layer) { layer.bindPopup('<b>' + text + '</b>'); };
    }

    var deepStateLayer = L.geoJSON(null, {
      style: function() { return styleFor('#cc0000'); },
      onEachFeature: polygonPopup(t('territoryRF'))
    });
    var counterLayer = L.geoJSON(null, {
      style: function() {
        return { color: '#0088cc', weight: 2, opacity: 0.85, fill: false, fillOpacity: 0, dashArray: '5,5' };
      },
      onEachFeature: polygonPopup(t('counteroffensive'))
    });

    fetch('https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/deepstate-map-data.geojson.gz')
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buffer) {
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([buffer]).stream().pipeThrough(ds);
        return new Response(stream).json();
      })
      .then(function(data) {
        var features = data.features || [];
        if (features.length > 0) {
          features.sort(function(a, b) { return (b.properties.date || '').localeCompare(a.properties.date || ''); });
          deepStateLayer.addData(features[0]);
          console.log('✅ DeepStateMap загружен');
        }
      })
      .catch(function(err) { console.warn('DeepStateMap:', err.message); });

    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/Claimed_Ukrainian_Counteroffensive_March_to_July/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) { counterLayer.addData(d); })
      .catch(function(err) { console.warn('ISW counter:', err.message); });

    deepStateLayer.addTo(map);
    counterLayer.addTo(map);

    // ============================================================
    // 4. SVG-ИКОНКИ СОБЫТИЙ
    // ============================================================
    var WT_COLORS = {
      'Air Raid Alert': '#e6a800',
      'Military Strike': '#c62828',
      'Military Operation': '#e65100',
      'Military Offensive': '#8e0000',
      'Security Incident': '#5a5a5a',
      'Political Development': '#1565c0'
    };
    var WT_LABELS = {
      'Air Raid Alert': 'raidAlert', 'Military Strike': 'strike',
      'Military Operation': 'operation', 'Military Offensive': 'offensive',
      'Security Incident': 'incident', 'Political Development': 'politics'
    };

    var WT_SVG = {
      'Air Raid Alert': '<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>',
      'Military Strike': '<svg viewBox="0 0 24 24"><path d="M12 1l-2 7H3l6 4-2 9 5-4 5 4-2-9 6-4h-7z"/></svg>',
      'Military Operation': '<svg viewBox="0 0 24 24"><path d="M6.9 5L5 6.9l5.5 5.5L12 11 6.9 5zM17.1 5L12 11l1.5 1.4L19 6.9 17.1 5zM4 18l6-6 1.5 1.5L5.5 19.5 4 18zM20 18l-1.5 1.5-6-6L14 12l6 6z"/></svg>',
      'Military Offensive': '<svg viewBox="0 0 24 24"><path d="M12 2s-3 4-3 8c0 2 1 4 3 5 2-1 3-3 3-5 0-4-3-8-3-8zm0 12c-1.5 0-3 1-3 3v3l3-2 3 2v-3c0-2-1.5-3-3-3z"/></svg>',
      'Security Incident': '<svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4l7 13H5l7-13zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>',
      'Political Development': '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>'
    };

    function wtColor(type) { return WT_COLORS[type] || '#9933cc'; }
    function wtSvg(type) { return WT_SVG[type] || WT_SVG['Security Incident']; }

    function createEventIcon(eventType) {
      var color = wtColor(eventType);
      var svg = wtSvg(eventType);
      return L.divIcon({
        html: '<div class="event-icon" style="background:' + color + ';">' + svg + '</div>',
        className: '',
        iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -15]
      });
    }

    var activeEventTypes = {
      'Air Raid Alert': true, 'Military Strike': true, 'Military Operation': true,
      'Military Offensive': true, 'Security Incident': true, 'Political Development': true
    };

    // ============================================================
    // 5. TELEGRAM-СОБЫТИЯ
    // ============================================================
    var tgLayer = new L.FeatureGroup();
    map.addLayer(tgLayer);

    function loadTelegramEvents() {
      if (!window.TG_DATA) {
        console.warn('Telegram: данные не загружены');
        document.getElementById('eventsListBody').innerHTML =
          '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">' +
          'Данные не подгрузились. Подождите следующего обновления.</div>';
        return;
      }
      tgLayer.clearLayers();
      var list = (window.TG_DATA && window.TG_DATA.events) || [];
      var added = 0;
      var panelEvents = [];

      list.forEach(function(ev) {
        if (!ev.lat || !ev.lng) return;
        if (!activeEventTypes[ev.event_type]) return;

        var marker = L.marker([ev.lat, ev.lng], { icon: createEventIcon(ev.event_type), riseOnHover: true });
        var label = t(WT_LABELS[ev.event_type] || ev.event_type);
        var dateStr = ev.date || '';
        try { dateStr = new Date(ev.date).toLocaleString('ru-RU'); } catch(e) {}

        var countryLabel = ev.country === 'UA' ? t('countryUA') : (ev.country === 'RU' ? t('countryRU') : t('countryOSINT'));
        var countryClass = ev.country === 'UA' ? 'ua' : (ev.country === 'RU' ? 'ru' : 'osint');
        var badge = '<span class="evt-country ' + countryClass + '" style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;">' + countryLabel + '</span>';

        marker.bindPopup(
          '<b>' + label + '</b> ' + badge + '<br>' +
          '<i>' + (ev.location || '') + '</i><br>' +
          (ev.description || '') + '<br>' +
          '<small>' + dateStr + '</small><br>' +
          '<small style="color:#888;">@' + (ev.channel || '') + '</small><br>' +
          '<a href="' + ev.url + '" target="_blank">' + t('source') + ' →</a>'
        );
        tgLayer.addLayer(marker);
        added++;
        panelEvents.push(ev);
      });

      console.log('Telegram: ' + added + ' событий');
      renderEventsPanel(panelEvents);
    }

    // ============================================================
    // 6. ПАНЕЛЬ СОБЫТИЙ
    // ============================================================
    function renderEventsPanel(events) {
      var body = document.getElementById('eventsListBody');
      document.getElementById('eventsPanelTitle').textContent = t('eventsPanelTitle');

      if (!events || events.length === 0) {
        body.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">' +
                         t('noEvents') + '</div>';
        return;
      }

      events.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        return db - da;
      });

      var counts = {};
      events.forEach(function(ev) { counts[ev.event_type] = (counts[ev.event_type] || 0) + 1; });

      var html = '<div class="summary-box">';
      html += '<div class="summary-title">' + t('summaryTitle') + '</div>';
      Object.keys(counts).forEach(function(type) {
        var svg = wtSvg(type);
        html += '<div class="summary-line"><span style="display:flex;align-items:center;">' +
                '<span style="color:' + wtColor(type) + ';display:flex;align-items:center;margin-right:6px;">' + svg + '</span>' +
                t(WT_LABELS[type] || type) +
                '</span><span>' + counts[type] + '</span></div>';
      });
      html += '<div class="summary-line" style="margin-top:4px;font-weight:600;">' +
              '<span>' + t('total') + '</span><span>' + events.length + ' ' + t('eventsCount') + '</span></div>';
      html += '</div>';

      events.slice(0, 60).forEach(function(ev) {
        var label = t(WT_LABELS[ev.event_type] || ev.event_type);
        var color = wtColor(ev.event_type);
        var svg = wtSvg(ev.event_type);
        var time = '';
        try { time = new Date(ev.date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}
        var countryLabel = ev.country === 'UA' ? t('countryUA') : (ev.country === 'RU' ? t('countryRU') : t('countryOSINT'));
        var countryClass = ev.country === 'UA' ? 'ua' : (ev.country === 'RU' ? 'ru' : 'osint');

        html += '<div class="event-item" data-lat="' + ev.lat + '" data-lng="' + ev.lng + '">' +
                '<div class="evt-type" style="color:' + color + ';">' +
                '<span style="color:' + color + ';display:flex;align-items:center;">' + svg + '</span>' + label +
                '<span class="evt-country ' + countryClass + '">' + countryLabel + '</span></div>' +
                '<div class="evt-loc">' + (ev.location || '') + ' <span style="color:#aaa;">@' + (ev.channel || '') + '</span></div>' +
                '<div class="evt-time">' + time + '</div></div>';
      });

      body.innerHTML = html;
      body.querySelectorAll('.event-item').forEach(function(item) {
        item.addEventListener('click', function() {
          var lat = parseFloat(this.getAttribute('data-lat'));
          var lng = parseFloat(this.getAttribute('data-lng'));
          if (!isNaN(lat) && !isNaN(lng)) map.setView([lat, lng], 12);
        });
      });
    }

    document.getElementById('toggleEventsPanel').addEventListener('click', function() {
      var panel = document.getElementById('eventsPanel');
      panel.classList.toggle('collapsed');
      this.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
    });

    // ============================================================
    // 7. ИНСТРУМЕНТЫ РИСОВАНИЯ
    // ============================================================
    var drawingsLayer = new L.FeatureGroup();
    map.addLayer(drawingsLayer);
    var currentDrawer = null, currentTool = null, lastMeasureLayer = null;

    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#toolbar button[data-tool]').forEach(function(btn) {
        if (btn.getAttribute('data-tool') === tool) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }
    function deactivateDrawer() {
      if (currentDrawer) { try { currentDrawer.disable(); } catch(e) {} currentDrawer = null; }
      setActiveTool(null);
    }
    function activateTool(tool) {
      if (currentTool === tool) { deactivateDrawer(); return; }
      deactivateDrawer();
      setActiveTool(tool);
      var opts = { metric: true };
      if (tool === 'marker') currentDrawer = new L.Draw.Marker(map);
      else if (tool === 'line') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'arrow') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'polygon') currentDrawer = new L.Draw.Polygon(map, { metric: true });
      else if (tool === 'rectangle') currentDrawer = new L.Draw.Rectangle(map);
      else if (tool === 'circle') currentDrawer = new L.Draw.Circle(map, { metric: true });
      else if (tool === 'measure') currentDrawer = new L.Draw.Polyline(map, opts);
      if (currentDrawer) currentDrawer.enable();
    }

    map.on(L.Draw.Event.CREATED, function(e) {
      var layer = e.layer, type = e.layerType, tool = currentTool;
      if (tool === 'measure') {
        if (lastMeasureLayer) drawingsLayer.removeLayer(lastMeasureLayer);
        if (layer.setStyle) layer.setStyle({ color: '#ff00aa', weight: 3, dashArray: '8,4' });
        lastMeasureLayer = layer;
      }
      if (tool === 'arrow' && type === 'polyline') {
        var latlngs = layer.getLatLngs();
        if (latlngs.length > 0 && Array.isArray(latlngs[0])) latlngs = latlngs[0];
        if (latlngs.length >= 2) {
          if (layer.setStyle) layer.setStyle({ color: '#ff3366', weight: 3 });
          drawingsLayer.addLayer(layer);
          var decorator = L.polylineDecorator(layer, {
            patterns: [{ offset: '100%', repeat: 0,
              symbol: L.Symbol.arrowHead({ pixelSize: 15, polygon: false,
                pathOptions: { stroke: true, color: '#ff3366', weight: 3, fillOpacity: 1 } })
            }]
          });
          layer._arrowDecorator = decorator;
          drawingsLayer.addLayer(decorator);
          saveDrawings(); deactivateDrawer(); return;
        }
      }
      if (layer.setStyle) {
        if (type === 'polygon' || type === 'rectangle' || type === 'circle') {
          layer.setStyle({ color: '#9933ff', weight: 2, fill: true, fillColor: '#9933ff', fillOpacity: 0.2 });
        } else if (type === 'polyline' && tool !== 'measure') {
          layer.setStyle({ color: '#ff6600', weight: 3 });
        }
      }
      if (type === 'marker') layer.bindPopup('Ваша метка');
      drawingsLayer.addLayer(layer);
      saveDrawings(); deactivateDrawer();
    });

    var DRAWINGS_KEY = 'osint_user_drawings';
    function saveDrawings() {
      try { localStorage.setItem(DRAWINGS_KEY, JSON.stringify(drawingsLayer.toGeoJSON())); }
      catch(e) { console.warn('saveDrawings:', e); }
    }
    function loadDrawings() {
      try {
        var raw = localStorage.getItem(DRAWINGS_KEY);
        if (!raw) return;
        var geojson = JSON.parse(raw);
        drawingsLayer.clearLayers();
        L.geoJSON(geojson, {
          onEachFeature: function(feature, layer) {
            if (feature.geometry.type === 'Point') layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 2 });
            else if (feature.geometry.type === 'Polygon') layer.setStyle && layer.setStyle({ color: '#9933ff', weight: 2, fill: true, fillColor: '#9933ff', fillOpacity: 0.2 });
            else if (feature.geometry.type === 'LineString') layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 3 });
            drawingsLayer.addLayer(layer);
          }
        });
      } catch(e) { console.warn('loadDrawings:', e); }
    }

    function renderToolbar() {
      var toolbar = document.getElementById('toolbar');
      var themeIcon = currentTheme === 'dark' ? TOOLBAR_SVG.sun : TOOLBAR_SVG.moon;
      var tools = [
        { key: 'marker', svg: TOOLBAR_SVG.marker },
        { key: 'line', svg: TOOLBAR_SVG.line },
        { key: 'arrow', svg: TOOLBAR_SVG.arrow },
        { key: 'polygon', svg: TOOLBAR_SVG.polygon },
        { key: 'rectangle', svg: TOOLBAR_SVG.rectangle },
        { key: 'circle', svg: TOOLBAR_SVG.circle },
        { sep: true },
        { key: 'measure', svg: TOOLBAR_SVG.measure },
        { sep: true },
        { key: 'clear', svg: TOOLBAR_SVG.clear, danger: true },
        { sep: true },
        { key: 'theme', svg: themeIcon },
        { sep: true },
        { key: 'info', svg: TOOLBAR_SVG.info }
      ];
      var html = '';
      tools.forEach(function(item) {
        if (item.sep) { html += '<div class="sep"></div>'; return; }
        var tooltip = t('tool' + item.key.charAt(0).toUpperCase() + item.key.slice(1));
        html += '<button data-tool="' + item.key + '"' + (item.danger ? ' class="danger"' : '') + '>' +
                item.svg + '<span class="tooltip">' + tooltip + '</span></button>';
      });
      toolbar.innerHTML = html;
      toolbar.querySelectorAll('button[data-tool]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tool = this.getAttribute('data-tool');
          if (tool === 'clear') {
            if (confirm(t('clearConfirm'))) {
              drawingsLayer.clearLayers(); lastMeasureLayer = null;
              localStorage.removeItem(DRAWINGS_KEY);
            }
            return;
          }
          if (tool === 'theme') { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); return; }
          if (tool === 'info') { alert(t('aboutText')); return; }
          activateTool(tool);
        });
      });
    }
    renderToolbar();
    loadDrawings();

    // ============================================================
    // 8. ПАНЕЛЬ
    // ============================================================
    var panel = L.control({ position: 'topright' });
    panel.onAdd = function() {
      var div = L.DomUtil.create('div', 'control-panel');

      function render() {
        var html = '';
        html += '<div class="lang-switch">' +
                '<button class="lang-btn' + (currentLang === 'ru' ? ' active' : '') + '" data-lang="ru">RU</button>' +
                '<button class="lang-btn' + (currentLang === 'uk' ? ' active' : '') + '" data-lang="uk">UA</button>' +
                '<button class="lang-btn' + (currentLang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>' +
                '</div>';
        html += '<h4>' + t('controlZones') + '</h4>';
        html += '<label><input type="checkbox" id="chkZone" checked> ' + t('territoryRF') + '</label>';
        html += '<label><input type="checkbox" id="chkCounter" checked> ' + t('counteroffensive') + '</label>';
        html += '<hr><h4>' + t('telegramEvents') + '</h4>';
        html += '<label><input type="checkbox" id="chkTg" checked> Показывать события</label>';
        [
          { key: 'Air Raid Alert', label: t('raidAlert') },
          { key: 'Military Strike', label: t('strike') },
          { key: 'Military Operation', label: t('operation') },
          { key: 'Military Offensive', label: t('offensive') },
          { key: 'Security Incident', label: t('incident') },
          { key: 'Political Development', label: t('politics') }
        ].forEach(function(item) {
          var svg = wtSvg(item.key);
          html += '<label><input type="checkbox" class="wt-filter" data-type="' + item.key + '"' +
                  (activeEventTypes[item.key] ? ' checked' : '') + '> ' +
                  '<span style="color:' + wtColor(item.key) + ';display:inline-flex;align-items:center;width:16px;height:16px;">' + svg + '</span> ' +
                  item.label + '</label>';
        });
        html += '<hr>';
        html += '<div class="opacity-row"><label>' + t('opacityLabel') + '</label>' +
                '<input type="range" id="opacitySlider" min="0" max="50" step="1" value="' + Math.round(fillOpacity * 100) + '">' +
                '<span class="opacity-value" id="opacityValue">' + Math.round(fillOpacity * 100) + '%</span></div>';
        html += '<div class="mode-toggle">' +
                '<button data-mode="fill" class="' + (layerMode === 'fill' ? 'active' : '') + '">' + t('modeFill') + '</button>' +
                '<button data-mode="outline" class="' + (layerMode === 'outline' ? 'active' : '') + '">' + t('modeOutline') + '</button>' +
                '</div>';
        div.innerHTML = html;
        attach();
      }

      function attach() {
        div.querySelectorAll('.lang-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentLang = this.getAttribute('data-lang');
            render(); updateLegend(); renderToolbar();
            loadTelegramEvents();
          });
        });
        var chkZone = div.querySelector('#chkZone');
        if (chkZone) chkZone.addEventListener('change', function() {
          if (this.checked) deepStateLayer.addTo(map); else map.removeLayer(deepStateLayer);
        });
        var chkCounter = div.querySelector('#chkCounter');
        if (chkCounter) chkCounter.addEventListener('change', function() {
          if (this.checked) counterLayer.addTo(map); else map.removeLayer(counterLayer);
        });
        var chkTg = div.querySelector('#chkTg');
        if (chkTg) chkTg.addEventListener('change', function() {
          if (this.checked) tgLayer.addTo(map); else map.removeLayer(tgLayer);
        });
        var slider = div.querySelector('#opacitySlider');
        var sliderValue = div.querySelector('#opacityValue');
        if (slider) slider.addEventListener('input', function() {
          fillOpacity = parseInt(this.value, 10) / 100;
          sliderValue.textContent = this.value + '%';
          refreshAllStyles(); saveSettings();
        });
        div.querySelectorAll('.mode-toggle button').forEach(function(btn) {
          btn.addEventListener('click', function() {
            layerMode = this.getAttribute('data-mode');
            div.querySelectorAll('.mode-toggle button').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            refreshAllStyles(); saveSettings();
          });
        });
        div.querySelectorAll('.wt-filter').forEach(function(chk) {
          chk.addEventListener('change', function() {
            activeEventTypes[this.getAttribute('data-type')] = this.checked;
            loadTelegramEvents();
          });
        });
      }

      render();
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    panel.addTo(map);

    // ============================================================
    // 9. ЛЕГЕНДА
    // ============================================================
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      var div = L.DomUtil.create('div', 'info legend');
      updateLegendInDiv(div);
      return div;
    };
    legend.addTo(map);

    function updateLegend() {
      var div = document.querySelector('.info.legend');
      if (div) updateLegendInDiv(div);
    }
    function updateLegendInDiv(div) {
      var html = '<h4>' + t('controlZones') + '</h4>';
      html += '<div><i style="background:#cc0000;"></i> ' + t('territoryRF') + '</div>';
      html += '<div><span class="legend-line" style="background:#0088cc;"></span> ' + t('counteroffensive') + '</div>';
      html += '<hr><h4>' + t('telegramEvents') + '</h4>';
      ['Air Raid Alert','Military Strike','Military Operation','Military Offensive','Security Incident','Political Development'].forEach(function(type) {
        html += '<div><span class="legend-svg" style="color:' + wtColor(type) + ';">' + wtSvg(type) + '</span> ' +
                t(WT_LABELS[type]) + '</div>';
      });
      html += '<hr><div style="font-size:11px;color:var(--text-muted);">Telegram · DeepStateMap · ISW</div>';
      div.innerHTML = html;
    }

    // ============================================================
    // 10. ЗАПУСК
    // ============================================================
    loadTelegramEvents();
  </script>
</body>
</html>
