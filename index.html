<!DOCTYPE html>
<html>
<head>
  <title>OSINT-карта</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* Панель управления */
    .control-panel {
      background: #fff; padding: 10px 12px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); font-size: 13px;
      max-width: 260px;
    }
    .control-panel h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; color: #555; }
    .control-panel label { display: block; padding: 3px 0; cursor: pointer; }
    .control-panel hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
    .control-panel button {
      display: block; width: 100%; margin: 4px 0; padding: 6px 8px;
      border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px;
      cursor: pointer; font-size: 12px;
    }
    .control-panel input[type="email"],
    .control-panel input[type="password"] {
      width: 100%; padding: 5px; margin: 3px 0; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
    }

    /* Категории */
    .category-item {
      display: flex; align-items: center; padding: 5px 6px; margin: 2px 0;
      border-radius: 4px; cursor: pointer; border: 2px solid transparent;
    }
    .category-item.active { border-color: #0066ff; background: #eef5ff; }
    .category-item .swatch {
      width: 16px; height: 16px; border-radius: 3px; margin-right: 8px;
      border: 1px solid rgba(0,0,0,0.2);
    }

    /* Сообщение о статусе */
    .status-msg {
      padding: 6px 8px; margin-top: 6px; border-radius: 4px;
      font-size: 11px; text-align: center;
    }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-err { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Подключаем Leaflet, Leaflet.draw и Supabase -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================================
    // 1. НАСТРОЙКИ SUPABASE (ВАШИ КЛЮЧИ)
    // ============================================================
    const SUPABASE_URL = 'https://zojqbhnwsycqhaiqpgxh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvanFiaG53c3ljcWhhaXFwZ3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjY2NzMsImV4cCI6MjEwNjAwMjY3M30.OwU-cwkvk0Z1a28xgKpwMl9p-h-gFObYJ6_PHhFeIHE';

    // Инициализация клиента Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================================
    // 2. КАТЕГОРИИ СОБЫТИЙ
    // ============================================================
    const CATEGORIES = {
      'battle':    { label: 'Бой',          color: '#ff6600' },
      'shelling':  { label: 'Обстрел',      color: '#cc0000' },
      'airdefense':{ label: 'ППО',          color: '#0066ff' },
      'equipment': { label: 'Техника',      color: '#666666' },
      'civilian':  { label: 'Гражданские',  color: '#e6b800' },
      'other':     { label: 'Другое',       color: '#9933cc' }
    };
    let currentCategory = 'battle';

    // ============================================================
    // 3. КАРТА И ПОДЛОЖКА (Esri)
    // ============================================================
    const map = L.map('map').setView([48.5, 37.5], 7);

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri', maxZoom: 19 }
    ).addTo(map);

    // ============================================================
    // 4. СЛОИ OSINT (ОККУПИРОВАННЫЕ ТЕРРИТОРИИ + КОНТРНАСТУПЛЕНИЕ ВСУ)
    // ============================================================
    const occupiedLayer = L.geoJSON(null, {
      style: () => ({ color: '#cc0000', weight: 1.5, opacity: 0.9,
                      fillColor: '#cc0000', fillOpacity: 0.15 }),
      onEachFeature: (f, layer) => layer.bindPopup('<b>Оккупированные территории (DeepStateMap)</b>')
    });

    const counterLayer = L.geoJSON(null, {
      style: () => ({ color: '#0088cc', weight: 1.5, opacity: 0.9,
                      fillColor: '#0088cc', fillOpacity: 0.12, dashArray: '5,5' }),
      onEachFeature: (f, layer) => layer.bindPopup('<b>Контрнаступления ВСУ (ISW)</b>')
    });

    // DeepStateMap (оккупированные территории)
    const DEEPSTATE_URL = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/deepstate-map-data.geojson.gz';
    fetch(DEEPSTATE_URL)
      .then(r => r.arrayBuffer())
      .then(buffer => {
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([buffer]).stream().pipeThrough(ds);
        return new Response(stream).json();
      })
      .then(data => {
        const features = data.features || [];
        if (features.length > 0) {
          features.sort((a, b) => (b.properties.date || '').localeCompare(a.properties.date || ''));
          occupiedLayer.addData(features[0]);
        }
      })
      .catch(err => console.warn('DeepStateMap:', err.message));

    // ISW (контрнаступления ВСУ)
    const ISW_COUNTER_URL = 'https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/' +
      'Claimed_Ukrainian_Counteroffensive_March_to_July/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson';
    fetch(ISW_COUNTER_URL)
      .then(r => r.json())
      .then(d => counterLayer.addData(d))
      .catch(err => console.warn('ISW ВСУ:', err.message));

    occupiedLayer.addTo(map);
    counterLayer.addTo(map);

    // ============================================================
    // 5. СЛОЙ СОБЫТИЙ ИЗ SUPABASE
    // ============================================================
    const eventsLayer = new L.FeatureGroup();
    map.addLayer(eventsLayer);

    // Загрузка событий из Supabase
    async function loadEvents() {
      eventsLayer.clearLayers();
      const { data, error } = await supabase.from('events').select('*');
      if (error) { console.error('Ошибка загрузки событий:', error.message); return; }
      if (!data) return;
      data.forEach(ev => {
        const cat = CATEGORIES[ev.category] || CATEGORIES.other;
        const marker = L.circleMarker([ev.lat, ev.lng], {
          radius: 7, color: cat.color, fillColor: cat.color, fillOpacity: 0.8, weight: 2
        });
        marker.bindPopup(`<b>${cat.label}</b><br>${ev.description || ''}<br><small>${new Date(ev.created_at).toLocaleString('ru-RU')}</small>`);
        eventsLayer.addLayer(marker);
      });
      console.log(`✅ Загружено событий: ${data.length}`);
    }
    loadEvents();

    // ============================================================
    // 6. ИНСТРУМЕНТЫ РИСОВАНИЯ (только для админа)
    // ============================================================
    const drawControl = new L.Control.Draw({
      edit: { featureGroup: eventsLayer, remove: true },
      draw: {
        marker: true,
        polyline: false, polygon: false, rectangle: false, circle: false
      }
    });
    // Изначально рисование выключено
    // Включается после успешного входа

    // Обработка создания метки
    map.on(L.Draw.Event.CREATED, async (e) => {
      const layer = e.layer;
      const { lat, lng } = layer.getLatLng();
      const cat = CATEGORIES[currentCategory];

      // Сохраняем в Supabase
      const { error } = await supabase.from('events').insert({
        category: currentCategory,
        description: '',
        lat: lat,
        lng: lng
      });

      if (error) {
        alert('Ошибка сохранения: ' + error.message);
        return;
      }

      // Добавляем на карту
      layer.setStyle({ color: cat.color, fillColor: cat.color, fillOpacity: 0.8 });
      layer.bindPopup(`<b>${cat.label}</b><br><small>только что</small>`);
      eventsLayer.addLayer(layer);
    });

    // ============================================================
    // 7. ПАНЕЛЬ УПРАВЛЕНИЯ
    // ============================================================
    const panel = L.control({ position: 'topright' });
    panel.onAdd = () => {
      const div = L.DomUtil.create('div', 'control-panel');

      const catHtml = Object.keys(CATEGORIES).map(k => {
        const c = CATEGORIES[k];
        const active = k === currentCategory ? ' active' : '';
        return `<div class="category-item${active}" data-cat="${k}">
                  <div class="swatch" style="background:${c.color};"></div>
                  <div>${c.label}</div>
                </div>`;
      }).join('');

      div.innerHTML = `
        <h4>Слои OSINT</h4>
        <label><input type="checkbox" id="chkOccupied" checked> Оккупированные территории</label>
        <label><input type="checkbox" id="chkCounter" checked> Контрнаступления ВСУ</label>
        <hr>
        <div id="authBlock">
          <h4>Вход для админа</h4>
          <input type="email" id="authEmail" placeholder="Email">
          <input type="password" id="authPassword" placeholder="Пароль">
          <button id="btnLogin">Войти</button>
          <div id="authStatus" class="status-msg" style="display:none;"></div>
        </div>
        <div id="adminBlock" style="display:none;">
          <h4>Тип события</h4>
          <div id="categoryList">${catHtml}</div>
          <button id="btnLogout" style="color:#c00;">Выйти</button>
        </div>
      `;

      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    panel.addTo(map);

    // ============================================================
    // 8. ЛОГИКА АВТОРИЗАЦИИ И УПРАВЛЕНИЯ
    // ============================================================
    setTimeout(() => {
      // Переключатели слоёв
      document.getElementById('chkOccupied').addEventListener('change', function() {
        this.checked ? occupiedLayer.addTo(map) : map.removeLayer(occupiedLayer);
      });
      document.getElementById('chkCounter').addEventListener('change', function() {
        this.checked ? counterLayer.addTo(map) : map.removeLayer(counterLayer);
      });

      // Вход
      document.getElementById('btnLogin').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const status = document.getElementById('authStatus');

        if (!email || !password) {
          status.style.display = 'block';
          status.className = 'status-msg status-err';
          status.textContent = 'Введите email и пароль';
          return;
        }

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          status.style.display = 'block';
          status.className = 'status-msg status-err';
          status.textContent = 'Ошибка: ' + error.message;
          return;
        }

        // Успешный вход
        status.style.display = 'block';
        status.className = 'status-msg status-ok';
        status.textContent = 'Вы вошли как админ';

        document.getElementById('authBlock').style.display = 'none';
        document.getElementById('adminBlock').style.display = 'block';
        map.addControl(drawControl); // Включаем рисование
      });

      // Выход
      document.getElementById('btnLogout').addEventListener('click', async () => {
        await supabase.auth.signOut();
        document.getElementById('authBlock').style.display = 'block';
        document.getElementById('adminBlock').style.display = 'none';
        document.getElementById('authStatus').style.display = 'none';
        map.removeControl(drawControl);
      });

      // Выбор категории
      document.querySelectorAll('.category-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.getAttribute('data-cat');
        });
      });

      // Автовход, если сессия уже есть
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          document.getElementById('authBlock').style.display = 'none';
          document.getElementById('adminBlock').style.display = 'block';
          map.addControl(drawControl);
        }
      });
    }, 0);

    // Подписка на изменения (чтобы новые события появлялись у всех)
    supabase
      .channel('events-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, (payload) => {
        const ev = payload.new;
        const cat = CATEGORIES[ev.category] || CATEGORIES.other;
        const marker = L.circleMarker([ev.lat, ev.lng], {
          radius: 7, color: cat.color, fillColor: cat.color, fillOpacity: 0.8, weight: 2
        });
        marker.bindPopup(`<b>${cat.label}</b><br>${ev.description || ''}`);
        eventsLayer.addLayer(marker);
      })
      .subscribe();
  </script>
</body>
</html>
