<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT-карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    #map { height: 100vh; width: 100%; }
    #errorBox {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #ffebee; color: #c62828; padding: 12px 20px;
      border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 13px; z-index: 99999; max-width: 90%; display: none;
    }
    .control-panel {
      background: #fff; padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px;
      max-width: 300px; max-height: 90vh; overflow-y: auto;
      font-family: system-ui, sans-serif;
    }
    .control-panel h4 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #666; border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .control-panel label {
      display: flex; align-items: center; padding: 4px 0;
      cursor: pointer; font-size: 13px; gap: 6px;
    }
    .control-panel label input[type="checkbox"] {
      margin: 0; width: 15px; height: 15px; cursor: pointer;
    }
    .control-panel hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    .lang-switch { display: flex; gap: 4px; margin-bottom: 8px; }
    .lang-btn {
      flex: 1; padding: 4px 8px; border: 1px solid #ccc;
      background: #f8f8f8; border-radius: 4px; cursor: pointer;
      font-size: 12px; text-align: center; transition: all 0.2s;
    }
    .lang-btn.active { background: #0066ff; color: #fff; border-color: #0066ff; }

    .info.legend {
      background: white; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 12px;
      line-height: 1.6; max-width: 240px; max-height: 80vh;
      overflow-y: auto; font-family: system-ui, sans-serif;
    }
    .info.legend h4 {
      margin: 0 0 6px; font-size: 12px; color: #333;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .info.legend hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
    .info.legend i {
      width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 2px;
      opacity: 0.85; border-radius: 3px; display: inline-block;
    }
    .info.legend .legend-line {
      width: 18px; height: 3px; float: left; margin-right: 8px; margin-top: 7px;
      border-radius: 2px; display: inline-block;
    }

    #eventsPanel {
      position: fixed; left: 10px; top: 10px; bottom: 100px;
      width: 280px; background: #fff; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 1000;
      display: flex; flex-direction: column; font-size: 13px;
      font-family: system-ui, sans-serif;
    }
    #eventsPanel .panel-header {
      padding: 10px 14px; border-bottom: 1px solid #eee;
      font-weight: 600; font-size: 13px; display: flex;
      justify-content: space-between; align-items: center;
    }
    #eventsPanel .panel-header .toggle-btn {
      cursor: pointer; font-size: 16px; color: #888;
      background: none; border: none; padding: 0 4px;
    }
    #eventsPanel .panel-body { flex: 1; overflow-y: auto; padding: 6px 0; }
    #eventsPanel .event-item {
      padding: 8px 14px; border-bottom: 1px solid #f5f5f5;
      cursor: pointer; transition: background 0.15s;
    }
    #eventsPanel .event-item:hover { background: #f0f7ff; }
    #eventsPanel .event-item .evt-type { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
    #eventsPanel .event-item .evt-loc { font-size: 11px; color: #666; margin-bottom: 2px; }
    #eventsPanel .event-item .evt-time { font-size: 10px; color: #999; }
    #eventsPanel .summary-box {
      padding: 10px 14px; background: #f0f7ff; border-bottom: 1px solid #e0e8f0; font-size: 12px;
    }
    #eventsPanel .summary-box .summary-title { font-weight: 600; margin-bottom: 4px; color: #333; }
    #eventsPanel .summary-box .summary-line { display: flex; justify-content: space-between; padding: 2px 0; }
    #eventsPanel.collapsed { width: 40px; }
    #eventsPanel.collapsed .panel-body,
    #eventsPanel.collapsed .panel-header span { display: none; }
    #eventsPanel.collapsed .panel-header .toggle-btn { display: block; }

    /* ==================== ПАНЕЛЬ ИНСТРУМЕНТОВ ==================== */
    #toolbar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #fff; border-radius: 8px; padding: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex; gap: 4px; z-index: 1000;
      font-family: system-ui, sans-serif;
    }
    #toolbar button {
      width: 42px; height: 42px; border: 1px solid #ddd;
      background: #f8f8f8; border-radius: 6px; cursor: pointer;
      font-size: 18px; display: flex; align-items: center;
      justify-content: center; padding: 0; transition: all 0.15s;
      position: relative;
    }
    #toolbar button:hover {
      background: #e8f0ff; border-color: #0066ff;
    }
    #toolbar button.active {
      background: #0066ff; color: #fff; border-color: #0066ff;
    }
    #toolbar button.danger { color: #c00; border-color: #f0c0c0; }
    #toolbar button.danger:hover { background: #fee; }
    #toolbar button .tooltip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 4px 8px; border-radius: 4px;
      font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.15s; margin-bottom: 6px;
    }
    #toolbar button:hover .tooltip { opacity: 1; }
    #toolbar .sep {
      width: 1px; background: #ddd; margin: 4px 2px;
    }
    @media (max-width: 768px) {
      #eventsPanel { width: 220px; bottom: 130px; }
      .control-panel { max-width: 200px; font-size: 12px; }
      .info.legend { max-width: 160px; font-size: 11px; }
      #toolbar button { width: 36px; height: 36px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="errorBox"></div>

  <div id="eventsPanel">
    <div class="panel-header">
      <span id="eventsPanelTitle">События за сегодня</span>
      <button class="toggle-btn" id="toggleEventsPanel">◀</button>
    </div>
    <div class="panel-body" id="eventsListBody">
      <div style="padding: 20px; text-align: center; color: #999; font-size: 12px;">
        <span id="loadingEventsText">Загрузка событий...</span>
      </div>
    </div>
  </div>

  <div id="toolbar"></div>

  <script>
    window.addEventListener('error', function(e) {
      var box = document.getElementById('errorBox');
      if (box) { box.style.display = 'block'; box.textContent = 'Ошибка: ' + e.message; }
    });
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>

  <script>
    // ============================================================
    // 1. НАСТРОЙКИ И МУЛЬТИЯЗЫЧНОСТЬ
    // ============================================================
    var GITHUB_USER = 'freeosintmaper';
    var GITHUB_REPO = 'osint-map';
    var EVENTS_FILE_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/data/war-tracker.json';

    var i18n = {
      ru: {
        panelTitle: 'Слои и фильтры',
        eventsPanelTitle: 'События за сегодня',
        controlZones: 'Зоны контроля',
        territoryRF: 'Территория, занимаемая РФ',
        territoryUA: 'Территория под контролем Украины',
        counteroffensive: 'Контрнаступления ВСУ',
        newRussian: 'Новые территории РФ (сегодня)',
        newUkrainian: 'Возвращённые территории Украины (сегодня)',
        warTrackerEvents: 'События War-Tracker',
        raidAlert: 'Воздушная тревога',
        strike: 'Удар',
        operation: 'Операция',
        offensive: 'Наступление',
        incident: 'Инцидент',
        politics: 'Политика',
        summaryTitle: 'Сводка за сегодня',
        eventsCount: 'событий',
        noEvents: 'Нет событий за сегодня',
        source: 'Источник',
        tools: 'Инструменты',
        toolMarker: 'Метка',
        toolLine: 'Линия',
        toolArrow: 'Стрелка',
        toolPolygon: 'Зона',
        toolRectangle: 'Прямоугольник',
        toolCircle: 'Круг',
        toolMeasure: 'Измерить расстояние',
        toolClear: 'Очистить всё',
        clearConfirm: 'Удалить все ваши рисунки?',
        total: 'Всего'
      },
      uk: {
        panelTitle: 'Шари та фільтри',
        eventsPanelTitle: 'Події за сьогодні',
        controlZones: 'Зони контролю',
        territoryRF: 'Територія, яку займає РФ',
        territoryUA: 'Територія під контролем України',
        counteroffensive: 'Контрнаступи ЗСУ',
        newRussian: 'Нові території РФ (сьогодні)',
        newUkrainian: 'Повернені території України (сьогодні)',
        warTrackerEvents: 'Події War-Tracker',
        raidAlert: 'Повітряна тривога',
        strike: 'Удар',
        operation: 'Операція',
        offensive: 'Наступ',
        incident: 'Інцидент',
        politics: 'Політика',
        summaryTitle: 'Зведення за сьогодні',
        eventsCount: 'подій',
        noEvents: 'Немає подій за сьогодні',
        source: 'Джерело',
        tools: 'Інструменти',
        toolMarker: 'Мітка',
        toolLine: 'Лінія',
        toolArrow: 'Стрілка',
        toolPolygon: 'Зона',
        toolRectangle: 'Прямокутник',
        toolCircle: 'Коло',
        toolMeasure: 'Виміряти відстань',
        toolClear: 'Очистити все',
        clearConfirm: 'Видалити всі ваші малюнки?',
        total: 'Всього'
      },
      en: {
        panelTitle: 'Layers & Filters',
        eventsPanelTitle: "Today's Events",
        controlZones: 'Control Zones',
        territoryRF: 'Territory held by RF',
        territoryUA: 'Territory under Ukraine control',
        counteroffensive: 'Ukrainian counteroffensives',
        newRussian: 'New RF territory (today)',
        newUkrainian: 'Ukrainian recaptured territory (today)',
        warTrackerEvents: 'War-Tracker Events',
        raidAlert: 'Air Raid Alert',
        strike: 'Strike',
        operation: 'Operation',
        offensive: 'Offensive',
        incident: 'Incident',
        politics: 'Politics',
        summaryTitle: "Today's Summary",
        eventsCount: 'events',
        noEvents: 'No events today',
        source: 'Source',
        tools: 'Tools',
        toolMarker: 'Marker',
        toolLine: 'Line',
        toolArrow: 'Arrow',
        toolPolygon: 'Polygon',
        toolRectangle: 'Rectangle',
        toolCircle: 'Circle',
        toolMeasure: 'Measure distance',
        toolClear: 'Clear all',
        clearConfirm: 'Delete all your drawings?',
        total: 'Total'
      }
    };

    var currentLang = 'ru';
    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || (i18n.ru[key]) || key;
    }

    // ============================================================
    // 2. КАРТА
    // ============================================================
    var map = L.map('map', { zoomControl: false }).setView([48.5, 37.5], 7);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri', maxZoom: 19 }
    ).addTo(map);

    // ============================================================
    // 3. СЛОИ КОНТРОЛЯ
    // ============================================================
    var occupiedLayer = L.geoJSON(null, {
      style: function() { return { color: '#cc0000', weight: 1.5, opacity: 0.9, fillColor: '#cc0000', fillOpacity: 0.15 }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>' + t('territoryRF') + '</b>'); }
    });
    var ukraineControlLayer = L.geoJSON(null, {
      style: function() { return { color: '#0055cc', weight: 1.5, opacity: 0.9, fillColor: '#0055cc', fillOpacity: 0.12 }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>' + t('territoryUA') + '</b>'); }
    });
    var counterLayer = L.geoJSON(null, {
      style: function() { return { color: '#0088cc', weight: 1.5, opacity: 0.7, fillColor: '#0088cc', fillOpacity: 0.06, dashArray: '5,5' }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>' + t('counteroffensive') + '</b>'); }
    });
    var newRussianLayer = L.geoJSON(null, {
      style: function() { return { color: '#228B22', weight: 2, opacity: 0.9, fillColor: '#228B22', fillOpacity: 0.35, dashArray: '3,3' }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>' + t('newRussian') + '</b>'); }
    });
    var newUkrainianLayer = L.geoJSON(null, {
      style: function() { return { color: '#FF8C00', weight: 2, opacity: 0.9, fillColor: '#FF8C00', fillOpacity: 0.35, dashArray: '3,3' }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>' + t('newUkrainian') + '</b>'); }
    });

    fetch('https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/deepstate-map-data.geojson.gz')
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buffer) {
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([buffer]).stream().pipeThrough(ds);
        return new Response(stream).json();
      })
      .then(function(data) {
        var features = data.features || [];
        if (features.length > 0) {
          features.sort(function(a, b) { return (b.properties.date || '').localeCompare(a.properties.date || ''); });
          occupiedLayer.addData(features[0]);
          console.log('DeepStateMap загружен');
        }
      })
      .catch(function(err) { console.warn('DeepStateMap:', err.message); });

    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/SEP2025UACO/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) { ukraineControlLayer.addData(d); })
      .catch(function(err) { console.warn('ISW UA:', err.message); });

    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/Claimed_Ukrainian_Counteroffensive_March_to_July/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) { counterLayer.addData(d); })
      .catch(function(err) { console.warn('ISW counter:', err.message); });

    var today = new Date().toISOString().slice(0, 10);
    var todayStart = today + 'T00:00:00Z';

    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/VIEW_RussiaCoTinUkraine_V3/FeatureServer/49/query' +
          '?where=EditDate%20%3E%3D%20TIMESTAMP%20%27' + todayStart + '%27&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.features && d.features.length > 0) newRussianLayer.addData(d);
      })
      .catch(function(err) { console.warn('New RF:', err.message); });

    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/SEP2025UACO/FeatureServer/0/query' +
          '?where=EditDate%20%3E%3D%20TIMESTAMP%20%27' + todayStart + '%27&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.features && d.features.length > 0) newUkrainianLayer.addData(d);
      })
      .catch(function(err) { console.warn('New UA:', err.message); });

    occupiedLayer.addTo(map);
    ukraineControlLayer.addTo(map);
    counterLayer.addTo(map);
    newRussianLayer.addTo(map);
    newUkrainianLayer.addTo(map);

    // ============================================================
    // 4. СОБЫТИЯ WAR-TRACKER
    // ============================================================
    var wtLayer = new L.FeatureGroup();
    map.addLayer(wtLayer);

    var WT_COLORS = {
      'Air Raid Alert':         '#ffcc00',
      'Military Strike':        '#cc0000',
      'Military Operation':     '#ff6600',
      'Military Offensive':     '#990000',
      'Security Incident':      '#888888',
      'Political Development':  '#0088cc'
    };
    var WT_LABELS = {
      'Air Raid Alert':         'raidAlert',
      'Military Strike':        'strike',
      'Military Operation':     'operation',
      'Military Offensive':     'offensive',
      'Security Incident':      'incident',
      'Political Development':  'politics'
    };
    function wtColor(type) { return WT_COLORS[type] || '#9933cc'; }

    var activeEventTypes = {
      'Air Raid Alert': true,
      'Military Strike': true,
      'Military Operation': true,
      'Military Offensive': true,
      'Security Incident': true,
      'Political Development': true
    };

    function loadWarTrackerEvents() {
      fetch(EVENTS_FILE_URL + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
          wtLayer.clearLayers();
          var list = (data && data.events) || [];
          var added = 0;
          var todayEvents = [];

          list.forEach(function(ev) {
            if (!ev.lat || !ev.lng) return;
            if (!activeEventTypes[ev.event_type]) return;

            var color = wtColor(ev.event_type);
            var marker = L.circleMarker([ev.lat, ev.lng], {
              radius: 6, color: color, fillColor: color, fillOpacity: 0.7, weight: 2
            });

            var label = t(WT_LABELS[ev.event_type] || ev.event_type);
            var dateStr = '';
            try { dateStr = new Date(ev.date).toLocaleString('ru-RU'); } catch(e) {}

            marker.bindPopup(
              '<b>' + label + '</b><br>' +
              '<i>' + (ev.location || '') + '</i><br>' +
              (ev.description || '') + '<br>' +
              '<small>' + dateStr + '</small><br>' +
              '<a href="' + ev.url + '" target="_blank">' + t('source') + ' →</a>'
            );
            wtLayer.addLayer(marker);
            added++;

            try {
              var evDate = new Date(ev.date).toISOString().slice(0, 10);
              if (evDate === today) todayEvents.push(ev);
            } catch(e) {}
          });

          console.log('War-Tracker: загружено ' + added + ' из ' + list.length);
          renderEventsPanel(todayEvents);
        })
        .catch(function(err) {
          console.warn('War-Tracker:', err.message);
          document.getElementById('eventsListBody').innerHTML =
            '<div style="padding: 20px; text-align: center; color: #c00; font-size: 12px;">' +
            t('noEvents') + '</div>';
        });
    }

    function renderEventsPanel(events) {
      var body = document.getElementById('eventsListBody');
      document.getElementById('eventsPanelTitle').textContent = t('eventsPanelTitle');

      if (!events || events.length === 0) {
        body.innerHTML = '<div style="padding: 20px; text-align: center; color: #999; font-size: 12px;">' +
                         t('noEvents') + '</div>';
        return;
      }

      events.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

      var counts = {};
      events.forEach(function(ev) { counts[ev.event_type] = (counts[ev.event_type] || 0) + 1; });

      var html = '<div class="summary-box">';
      html += '<div class="summary-title">' + t('summaryTitle') + '</div>';
      Object.keys(counts).forEach(function(type) {
        html += '<div class="summary-line"><span>' + t(WT_LABELS[type] || type) +
                '</span><span>' + counts[type] + '</span></div>';
      });
      html += '<div class="summary-line" style="margin-top:4px;font-weight:600;">' +
              '<span>' + t('total') + '</span><span>' + events.length + ' ' + t('eventsCount') + '</span></div>';
      html += '</div>';

      events.slice(0, 50).forEach(function(ev) {
        var label = t(WT_LABELS[ev.event_type] || ev.event_type);
        var color = wtColor(ev.event_type);
        var time = '';
        try { time = new Date(ev.date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}
        html += '<div class="event-item" data-lat="' + ev.lat + '" data-lng="' + ev.lng + '">' +
                '<div class="evt-type" style="color:' + color + ';">' + label + '</div>' +
                '<div class="evt-loc">' + (ev.location || '') + '</div>' +
                '<div class="evt-time">' + time + '</div>' +
                '</div>';
      });

      body.innerHTML = html;
      body.querySelectorAll('.event-item').forEach(function(item) {
        item.addEventListener('click', function() {
          var lat = parseFloat(this.getAttribute('data-lat'));
          var lng = parseFloat(this.getAttribute('data-lng'));
          if (!isNaN(lat) && !isNaN(lng)) map.setView([lat, lng], 12);
        });
      });
    }

    document.getElementById('toggleEventsPanel').addEventListener('click', function() {
      var panel = document.getElementById('eventsPanel');
      panel.classList.toggle('collapsed');
      this.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
    });

    // ============================================================
    // 5. ИНСТРУМЕНТЫ РИСОВАНИЯ
    // ============================================================
    var drawingsLayer = new L.FeatureGroup();
    map.addLayer(drawingsLayer);

    var currentDrawer = null;
    var currentTool = null;
    var lastMeasureLayer = null;

    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#toolbar button[data-tool]').forEach(function(btn) {
        if (btn.getAttribute('data-tool') === tool) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    function deactivateDrawer() {
      if (currentDrawer) {
        try { currentDrawer.disable(); } catch(e) {}
        currentDrawer = null;
      }
      setActiveTool(null);
    }

    function activateTool(tool) {
      if (currentTool === tool) {
        deactivateDrawer();
        return;
      }
      deactivateDrawer();
      setActiveTool(tool);

      var opts = { metric: true };

      if (tool === 'marker') currentDrawer = new L.Draw.Marker(map);
      else if (tool === 'line') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'arrow') currentDrawer = new L.Draw.Polyline(map, opts);
      else if (tool === 'polygon') currentDrawer = new L.Draw.Polygon(map, { metric: true });
      else if (tool === 'rectangle') currentDrawer = new L.Draw.Rectangle(map);
      else if (tool === 'circle') currentDrawer = new L.Draw.Circle(map, { metric: true });
      else if (tool === 'measure') currentDrawer = new L.Draw.Polyline(map, opts);

      if (currentDrawer) currentDrawer.enable();
    }

    map.on(L.Draw.Event.CREATED, function(e) {
      var layer = e.layer;
      var type = e.layerType;
      var tool = currentTool;

      // Для измерения — удаляем предыдущее измерение
      if (tool === 'measure') {
        if (lastMeasureLayer) drawingsLayer.removeLayer(lastMeasureLayer);
        // Красим в другой цвет, чтобы отличать от обычной линии
        if (layer.setStyle) layer.setStyle({ color: '#ff00aa', weight: 3, dashArray: '8,4' });
        lastMeasureLayer = layer;
      }

      // Для стрелки — добавляем наконечник
      if (tool === 'arrow' && type === 'polyline') {
        var latlngs = layer.getLatLngs();
        // Если в polyline есть вложенные массивы (мульти-линия) — берём первый
        if (latlngs.length > 0 && Array.isArray(latlngs[0])) latlngs = latlngs[0];

        if (latlngs.length >= 2) {
          // Основная линия
          if (layer.setStyle) layer.setStyle({ color: '#ff3366', weight: 3 });
          drawingsLayer.addLayer(layer);
          // Декоратор со стрелками по всей длине
          var decorator = L.polylineDecorator(layer, {
            patterns: [{
              offset: '100%',
              repeat: 0,
              symbol: L.Symbol.arrowHead({
                pixelSize: 15,
                polygon: false,
                pathOptions: { stroke: true, color: '#ff3366', weight: 3, fillOpacity: 1 }
              })
            }]
          });
          layer._arrowDecorator = decorator;
          drawingsLayer.addLayer(decorator);
          saveDrawings();
          deactivateDrawer();
          return;
        }
      }

      if (layer.setStyle) {
        if (type === 'polygon' || type === 'rectangle') {
          layer.setStyle({ color: '#9933ff', weight: 2, fillColor: '#9933ff', fillOpacity: 0.2 });
        } else if (type === 'circle') {
          layer.setStyle({ color: '#9933ff', weight: 2, fillColor: '#9933ff', fillOpacity: 0.2 });
        } else if (type === 'polyline' && tool !== 'measure') {
          layer.setStyle({ color: '#ff6600', weight: 3 });
        }
      }

      if (type === 'marker') {
        layer.bindPopup('Ваша метка');
      }

      drawingsLayer.addLayer(layer);
      saveDrawings();
      deactivateDrawer();
    });

    // Сохранение/загрузка
    var DRAWINGS_KEY = 'osint_user_drawings';

    function saveDrawings() {
      try {
        var geojson = drawingsLayer.toGeoJSON();
        localStorage.setItem(DRAWINGS_KEY, JSON.stringify(geojson));
      } catch(e) { console.warn('saveDrawings:', e); }
    }

    function loadDrawings() {
      try {
        var raw = localStorage.getItem(DRAWINGS_KEY);
        if (!raw) return;
        var geojson = JSON.parse(raw);
        drawingsLayer.clearLayers();
        L.geoJSON(geojson, {
          onEachFeature: function(feature, layer) {
            if (feature.geometry.type === 'Point') {
              layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 2 });
            } else if (feature.geometry.type === 'Polygon') {
              layer.setStyle && layer.setStyle({ color: '#9933ff', weight: 2, fillColor: '#9933ff', fillOpacity: 0.2 });
            } else if (feature.geometry.type === 'LineString') {
              layer.setStyle && layer.setStyle({ color: '#ff3366', weight: 3 });
            }
            drawingsLayer.addLayer(layer);
          }
        });
      } catch(e) { console.warn('loadDrawings:', e); }
    }

    // ============================================================
    // 6. ПАНЕЛЬ ИНСТРУМЕНТОВ
    // ============================================================
    function renderToolbar() {
      var toolbar = document.getElementById('toolbar');
      var tools = [
        { key: 'marker',    icon: '📍' },
        { key: 'line',      icon: '〰️' },
        { key: 'arrow',     icon: '➡️' },
        { key: 'polygon',   icon: '⬡' },
        { key: 'rectangle', icon: '▭' },
        { key: 'circle',    icon: '⭕' },
        { sep: true },
        { key: 'measure',   icon: '📐' },
        { sep: true },
        { key: 'clear',     icon: '🗑️', danger: true }
      ];

      var html = '';
      tools.forEach(function(item) {
        if (item.sep) { html += '<div class="sep"></div>'; return; }
        var tooltip = t('tool' + item.key.charAt(0).toUpperCase() + item.key.slice(1));
        html += '<button data-tool="' + item.key + '"' +
                (item.danger ? ' class="danger"' : '') + '>' +
                item.icon +
                '<span class="tooltip">' + tooltip + '</span>' +
                '</button>';
      });
      toolbar.innerHTML = html;

      toolbar.querySelectorAll('button[data-tool]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tool = this.getAttribute('data-tool');
          if (tool === 'clear') {
            if (confirm(t('clearConfirm'))) {
              drawingsLayer.clearLayers();
              lastMeasureLayer = null;
              localStorage.removeItem(DRAWINGS_KEY);
            }
            return;
          }
          activateTool(tool);
        });
      });
    }

    renderToolbar();
    loadDrawings();

    // ============================================================
    // 7. ПАНЕЛЬ СЛОЁВ И ФИЛЬТРОВ
    // ============================================================
    var panel = L.control({ position: 'topright' });
    panel.onAdd = function() {
      var div = L.DomUtil.create('div', 'control-panel');

      function render() {
        var html = '';
        html += '<div class="lang-switch">' +
                '<button class="lang-btn' + (currentLang === 'ru' ? ' active' : '') + '" data-lang="ru">RU</button>' +
                '<button class="lang-btn' + (currentLang === 'uk' ? ' active' : '') + '" data-lang="uk">UA</button>' +
                '<button class="lang-btn' + (currentLang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>' +
                '</div>';

        html += '<h4>' + t('controlZones') + '</h4>' +
                '<label><input type="checkbox" id="chkOccupied" checked> ' + t('territoryRF') + '</label>' +
                '<label><input type="checkbox" id="chkUkraine" checked> ' + t('territoryUA') + '</label>' +
                '<label><input type="checkbox" id="chkCounter" checked> ' + t('counteroffensive') + '</label>' +
                '<label><input type="checkbox" id="chkNewRF" checked> ' + t('newRussian') + '</label>' +
                '<label><input type="checkbox" id="chkNewUA" checked> ' + t('newUkrainian') + '</label>';

        html += '<hr><h4>' + t('warTrackerEvents') + '</h4>';
        [
          { key: 'Air Raid Alert',       label: t('raidAlert') },
          { key: 'Military Strike',      label: t('strike') },
          { key: 'Military Operation',   label: t('operation') },
          { key: 'Military Offensive',   label: t('offensive') },
          { key: 'Security Incident',    label: t('incident') },
          { key: 'Political Development',label: t('politics') }
        ].forEach(function(item) {
          html += '<label><input type="checkbox" class="wt-filter" data-type="' + item.key + '"' +
                  (activeEventTypes[item.key] ? ' checked' : '') + '> ' + item.label + '</label>';
        });

        div.innerHTML = html;
        attach();
      }

      function attach() {
        div.querySelectorAll('.lang-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentLang = this.getAttribute('data-lang');
            render();
            updateLegend();
            renderToolbar();
            loadWarTrackerEvents();
          });
        });

        var map1 = {
          chkOccupied: occupiedLayer,
          chkUkraine: ukraineControlLayer,
          chkCounter: counterLayer,
          chkNewRF: newRussianLayer,
          chkNewUA: newUkrainianLayer
        };
        Object.keys(map1).forEach(function(id) {
          var chk = div.querySelector('#' + id);
          if (chk) chk.addEventListener('change', function() {
            if (this.checked) map1[id].addTo(map); else map.removeLayer(map1[id]);
          });
        });

        div.querySelectorAll('.wt-filter').forEach(function(chk) {
          chk.addEventListener('change', function() {
            activeEventTypes[this.getAttribute('data-type')] = this.checked;
            loadWarTrackerEvents();
          });
        });
      }

      render();
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    panel.addTo(map);

    // ============================================================
    // 8. ЛЕГЕНДА
    // ============================================================
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      var div = L.DomUtil.create('div', 'info legend');
      updateLegendInDiv(div);
      return div;
    };
    legend.addTo(map);

    function updateLegend() {
      var div = document.querySelector('.info.legend');
      if (div) updateLegendInDiv(div);
    }
    function updateLegendInDiv(div) {
      var html = '<h4>' + t('controlZones') + '</h4>';
      html += '<div><i style="background:#cc0000;"></i> ' + t('territoryRF') + '</div>';
      html += '<div><i style="background:#0055cc;"></i> ' + t('territoryUA') + '</div>';
      html += '<div><span class="legend-line" style="background:#0088cc;"></span> ' + t('counteroffensive') + '</div>';
      html += '<div><i style="background:#228B22;"></i> ' + t('newRussian') + '</div>';
      html += '<div><i style="background:#FF8C00;"></i> ' + t('newUkrainian') + '</div>';
      html += '<hr><h4>' + t('warTrackerEvents') + '</h4>';
      html += '<div><i style="background:#ffcc00;"></i> ' + t('raidAlert') + '</div>';
      html += '<div><i style="background:#cc0000;"></i> ' + t('strike') + '</div>';
      html += '<div><i style="background:#ff6600;"></i> ' + t('operation') + '</div>';
      html += '<div><i style="background:#990000;"></i> ' + t('offensive') + '</div>';
      html += '<div><i style="background:#888888;"></i> ' + t('incident') + '</div>';
      html += '<div><i style="background:#0088cc;"></i> ' + t('politics') + '</div>';
      html += '<hr><div style="font-size:11px;color:#888;">ISW · DeepStateMap · War-Tracker</div>';
      div.innerHTML = html;
    }

    // ============================================================
    // 9. ЗАПУСК
    // ============================================================
    loadWarTrackerEvents();
    setInterval(loadWarTrackerEvents, 600000);
  </script>
</body>
</html>
