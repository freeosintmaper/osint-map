<!DOCTYPE html>
<html>
<head>
  <title>OSINT-карта</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }
    #errorBox {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #ffebee; color: #c62828; padding: 12px 20px;
      border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 13px; z-index: 99999; max-width: 90%; display: none;
    }
    .control-panel {
      background: #fff; padding: 10px 12px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); font-size: 13px;
      max-width: 260px;
    }
    .control-panel h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; color: #555; }
    .control-panel label { display: block; padding: 3px 0; cursor: pointer; }
    .control-panel hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
    .control-panel button {
      display: block; width: 100%; margin: 4px 0; padding: 6px 8px;
      border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px;
      cursor: pointer; font-size: 12px;
    }
    .control-panel input[type="email"],
    .control-panel input[type="password"] {
      width: 100%; padding: 5px; margin: 3px 0; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
    }
    .category-item {
      display: flex; align-items: center; padding: 5px 6px; margin: 2px 0;
      border-radius: 4px; cursor: pointer; border: 2px solid transparent;
    }
    .category-item.active { border-color: #0066ff; background: #eef5ff; }
    .category-item .swatch {
      width: 16px; height: 16px; border-radius: 3px; margin-right: 8px;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .status-msg { padding: 6px 8px; margin-top: 6px; border-radius: 4px; font-size: 11px; text-align: center; }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-err { background: #ffebee; color: #c62828; }
    .info.legend {
      background: white; padding: 8px 12px; border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2); font-size: 13px;
      line-height: 1.5; max-width: 220px;
    }
    .info.legend h4 { margin: 0 0 6px; font-size: 13px; color: #333; }
    .info.legend hr { border: none; border-top: 1px solid #eee; margin: 6px 0; }
    .info.legend i {
      width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 3px;
      opacity: 0.8; border-radius: 3px; display: inline-block;
    }
    .info.legend .legend-line {
      width: 18px; height: 3px; float: left; margin-right: 8px; margin-top: 8px;
      border-radius: 2px; display: inline-block;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', function(e) {
      var box = document.getElementById('errorBox');
      if (box) { box.style.display = 'block'; box.textContent = 'Ошибка: ' + e.message; }
    });
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // ============================================================
    // 1. НАСТРОЙКИ
    // ============================================================
    var SB_URL = 'https://zojqbhnwsycqhaiqpgxh.supabase.co';
    var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvanFiaG53c3ljcWhhaXFwZ3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjY2NzMsImV4cCI6MjEwNjAwMjY3M30.OwU-cwkvk0Z1a28xgKpwMl9p-h-gFObYJ6_PHhFeIHE';

    var sb = null;
    try {
      var sbFactory = window.supabase && window.supabase.createClient;
      if (!sbFactory) throw new Error('Библиотека Supabase не загрузилась');
      sb = sbFactory(SB_URL, SB_KEY);
    } catch (err) {
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorBox').textContent = 'Ошибка базы: ' + err.message;
    }

    // ============================================================
    // 2. КАТЕГОРИИ
    // ============================================================
    var CATEGORIES = {
      'battle':    { label: 'Бой',          color: '#ff6600' },
      'shelling':  { label: 'Обстрел',      color: '#cc0000' },
      'airdefense':{ label: 'ППО',          color: '#0066ff' },
      'equipment': { label: 'Техника',      color: '#666666' },
      'civilian':  { label: 'Гражданские',  color: '#e6b800' },
      'other':     { label: 'Другое',       color: '#9933cc' }
    };
    var currentCategory = 'battle';

    // ============================================================
    // 3. КАРТА
    // ============================================================
    var map = L.map('map').setView([48.5, 37.5], 7);

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri', maxZoom: 19 }
    ).addTo(map);

    // ============================================================
    // 4. СЛОИ OSINT
    // ============================================================

    // 4.1. Территория, занимаемая РФ (красный)
    var occupiedLayer = L.geoJSON(null, {
      style: function() { return { color: '#cc0000', weight: 1.5, opacity: 0.9, fillColor: '#cc0000', fillOpacity: 0.10 }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>Территория, занимаемая РФ</b>'); }
    });

    // 4.2. Контрнаступления ВСУ (голубой пунктир)
    var counterLayer = L.geoJSON(null, {
      style: function() { return { color: '#0088cc', weight: 1.5, opacity: 0.9, fillColor: '#0088cc', fillOpacity: 0.08, dashArray: '5,5' }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>Контрнаступления ВСУ (ISW)</b>'); }
    });

    // 4.3. НОВЫЙ: Зона контроля Украины (синий)
    var ukraineControlLayer = L.geoJSON(null, {
      style: function() { return { color: '#003d99', weight: 1.5, opacity: 0.9, fillColor: '#0055cc', fillOpacity: 0.15 }; },
      onEachFeature: function(f, layer) { layer.bindPopup('<b>Территория под контролем Украины</b>'); }
    });

    // --- ЗАГРУЗКА ДАННЫХ ---

    // Источник для территории, занимаемой РФ.
    // Сначала пробуем DeepStateMap (может быть заблокирован из РФ),
    // если не получается — грузим с ISW (доступен из РФ).

    function loadFromISW() {
      console.log('Загружаем данные с ISW (ArcGIS)...');
      var ISW_RUSSIAN_URL = 'https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/' +
        'Russo_Ukraine_War_October_2025_Timelapse/FeatureServer/0/query' +
        '?where=1%3D1&outFields=*&f=geojson';

      fetch(ISW_RUSSIAN_URL)
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(d) {
          if (d && d.features && d.features.length > 0) {
            occupiedLayer.addData(d);
            console.log('✅ ISW: загружено объектов ' + d.features.length);
          } else {
            console.warn('ISW вернул пустой ответ');
          }
        })
        .catch(function(err) {
          console.warn('ISW тоже не сработал:', err.message);
        });
    }

    function loadFromDeepState() {
      console.log('Пробуем DeepStateMap...');
      fetch('https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/deepstate-map-data.geojson.gz')
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        })
        .then(function(buffer) {
          var ds = new DecompressionStream('gzip');
          var stream = new Blob([buffer]).stream().pipeThrough(ds);
          return new Response(stream).json();
        })
        .then(function(data) {
          var features = data.features || [];
          if (features.length > 0) {
            features.sort(function(a, b) { return (b.properties.date || '').localeCompare(a.properties.date || ''); });
            occupiedLayer.addData(features[0]);
            console.log('✅ DeepStateMap: загружено');
          } else {
            throw new Error('Пустой ответ');
          }
        })
        .catch(function(err) {
          console.warn('DeepStateMap недоступен (' + err.message + '), переключаюсь на ISW');
          loadFromISW();
        });
    }

    loadFromDeepState();

    // ISW — контрнаступления ВСУ
    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/Claimed_Ukrainian_Counteroffensive_March_to_July/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) { counterLayer.addData(d); })
      .catch(function(err) { console.warn('ISW (контрнаступления):', err.message); });

    // ISW — зона контроля Украины
    fetch('https://services5.arcgis.com/SaBe5HMtmnbqSWlu/arcgis/rest/services/March_PreppedTimelapse/FeatureServer/35/query?where=1%3D1&outFields=*&f=geojson')
      .then(function(r) { return r.json(); })
      .then(function(d) { ukraineControlLayer.addData(d); })
      .catch(function(err) { console.warn('ISW (контроль Украины):', err.message); });

    // Добавляем слои на карту
    occupiedLayer.addTo(map);
    counterLayer.addTo(map);
    ukraineControlLayer.addTo(map);

    // ============================================================
    // 5. СОБЫТИЯ ИЗ БАЗЫ
    // ============================================================
    var eventsLayer = new L.FeatureGroup();
    map.addLayer(eventsLayer);

    function drawEventMarker(ev) {
      var cat = CATEGORIES[ev.category] || CATEGORIES.other;
      var marker = L.circleMarker([ev.lat, ev.lng], {
        radius: 7, color: cat.color, fillColor: cat.color, fillOpacity: 0.8, weight: 2
      });
      marker._eventId = ev.id;
      marker.bindPopup('<b>' + cat.label + '</b><br>' + (ev.description || ''));
      eventsLayer.addLayer(marker);
    }

    function loadEvents() {
      if (!sb) return;
      sb.from('events').select('*').then(function(res) {
        if (res.error) { console.error('Ошибка загрузки:', res.error.message); return; }
        eventsLayer.clearLayers();
        (res.data || []).forEach(drawEventMarker);
        console.log('Загружено: ' + (res.data || []).length);
      });
    }
    loadEvents();

    // ============================================================
    // 5.1. АВТОМАТИЧЕСКИЕ СОБЫТИЯ С WAR-TRACKER
    // ============================================================
    var warTrackerLayer = new L.FeatureGroup();
    map.addLayer(warTrackerLayer);

    function loadWarTrackerEvents() {
      console.log('Загружаем события с War-Tracker...');
      var apiUrl = 'https://war-tracker.com/api/v1/events?country=UA&limit=50';

      fetch(apiUrl)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          warTrackerLayer.clearLayers();
          if (data && data.events) {
            data.events.forEach(function(event) {
              if (event.latitude && event.longitude) {
                var marker = L.circleMarker([event.latitude, event.longitude], {
                  radius: 6,
                  color: '#ffcc00',
                  fillColor: '#ffcc00',
                  fillOpacity: 0.9,
                  weight: 2
                });
                var popupContent = '<b>' + (event.event_type || 'Событие') + '</b><br>';
                popupContent += (event.description || 'Нет описания') + '<br>';
                popupContent += '<small>' + new Date(event.timestamp).toLocaleString('ru-RU') + '</small>';
                marker.bindPopup(popupContent);
                warTrackerLayer.addLayer(marker);
              }
            });
            console.log('✅ События с War-Tracker загружены: ' + data.events.length);
          }
        })
        .catch(function(err) {
          console.warn('⚠️ Не удалось загрузить события с War-Tracker:', err.message);
        });
    }

    loadWarTrackerEvents();
    setInterval(loadWarTrackerEvents, 300000); // Каждые 5 минут

    // ============================================================
    // 6. РИСОВАНИЕ
    // ============================================================
    var drawControl = new L.Control.Draw({
      edit: { featureGroup: eventsLayer, remove: true },
      draw: { marker: true, polyline: false, polygon: false, rectangle: false, circle: false }
    });

    map.on(L.Draw.Event.DELETED, function(e) {
      e.layers.eachLayer(function(layer) {
        if (layer._eventId && sb) {
          sb.from('events').delete().eq('id', layer._eventId).then(function(res) {
            if (res.error) alert('Ошибка удаления из базы: ' + res.error.message);
            else console.log('Удалено событие id=' + layer._eventId);
          });
        }
      });
    });

    map.on(L.Draw.Event.CREATED, function(e) {
      var latlng = e.layer.getLatLng();
      var cat = CATEGORIES[currentCategory];
      if (!sb) { alert('Нет подключения к базе'); return; }

      sb.from('events').insert({
        category: currentCategory, description: '', lat: latlng.lat, lng: latlng.lng
      }).then(function(res) {
        if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
        var marker = L.circleMarker([latlng.lat, latlng.lng], {
          radius: 7, color: cat.color, fillColor: cat.color, fillOpacity: 0.8, weight: 2
        });
        marker.bindPopup('<b>' + cat.label + '</b><br><small>только что</small>');
        eventsLayer.addLayer(marker);
      });
    });

    // ============================================================
    // 7. ПАНЕЛЬ
    // ============================================================
    var panel = L.control({ position: 'topright' });
    panel.onAdd = function() {
      var div = L.DomUtil.create('div', 'control-panel');
      var catHtml = '';
      Object.keys(CATEGORIES).forEach(function(k) {
        var c = CATEGORIES[k];
        var active = k === currentCategory ? ' active' : '';
        catHtml += '<div class="category-item' + active + '" data-cat="' + k + '">' +
                   '<div class="swatch" style="background:' + c.color + ';"></div>' +
                   '<div>' + c.label + '</div></div>';
      });

      div.innerHTML =
        '<h4>Слои OSINT</h4>' +
        '<label><input type="checkbox" id="chkOccupied" checked> Территория, занимаемая РФ</label>' +
        '<label><input type="checkbox" id="chkCounter" checked> Контрнаступления ВСУ</label>' +
        '<label><input type="checkbox" id="chkUkraine" checked> Контроль Украины</label>' +
        '<hr>' +
        '<div id="authBlock">' +
          '<h4>Вход для админа</h4>' +
          '<input type="email" id="authEmail" placeholder="Email">' +
          '<input type="password" id="authPassword" placeholder="Пароль">' +
          '<button id="btnLogin">Войти</button>' +
          '<div id="authStatus" class="status-msg" style="display:none;"></div>' +
        '</div>' +
        '<div id="adminBlock" style="display:none;">' +
          '<h4>Тип события</h4>' +
          '<div id="categoryList">' + catHtml + '</div>' +
          '<button id="btnLogout" style="color:#c00;">Выйти</button>' +
        '</div>';

      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    panel.addTo(map);

    // ============================================================
    // 8. ЛОГИКА
    // ============================================================
    setTimeout(function() {
      document.getElementById('chkOccupied').addEventListener('change', function() {
        if (this.checked) occupiedLayer.addTo(map); else map.removeLayer(occupiedLayer);
      });
      document.getElementById('chkCounter').addEventListener('change', function() {
        if (this.checked) counterLayer.addTo(map); else map.removeLayer(counterLayer);
      });
      document.getElementById('chkUkraine').addEventListener('change', function() {
        if (this.checked) ukraineControlLayer.addTo(map); else map.removeLayer(ukraineControlLayer);
      });

      document.getElementById('btnLogin').addEventListener('click', function() {
        var email = document.getElementById('authEmail').value.trim();
        var password = document.getElementById('authPassword').value;
        var status = document.getElementById('authStatus');
        if (!email || !password) {
          status.style.display = 'block'; status.className = 'status-msg status-err';
          status.textContent = 'Введите email и пароль'; return;
        }
        if (!sb) {
          status.style.display = 'block'; status.className = 'status-msg status-err';
          status.textContent = 'Нет подключения к базе'; return;
        }
        sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
          if (res.error) {
            status.style.display = 'block'; status.className = 'status-msg status-err';
            status.textContent = 'Ошибка: ' + res.error.message; return;
          }
          status.style.display = 'block'; status.className = 'status-msg status-ok';
          status.textContent = 'Вы вошли как админ';
          document.getElementById('authBlock').style.display = 'none';
          document.getElementById('adminBlock').style.display = 'block';
          map.addControl(drawControl);
        });
      });

      document.getElementById('btnLogout').addEventListener('click', function() {
        sb.auth.signOut().then(function() {
          document.getElementById('authBlock').style.display = 'block';
          document.getElementById('adminBlock').style.display = 'none';
          document.getElementById('authStatus').style.display = 'none';
          map.removeControl(drawControl);
        });
      });

      document.querySelectorAll('.category-item').forEach(function(item) {
        item.addEventListener('click', function() {
          document.querySelectorAll('.category-item').forEach(function(el) { el.classList.remove('active'); });
          this.classList.add('active');
          currentCategory = this.getAttribute('data-cat');
        });
      });

      if (sb) {
        sb.auth.getSession().then(function(res) {
          if (res.data && res.data.session) {
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('adminBlock').style.display = 'block';
            map.addControl(drawControl);
          }
        });
        sb.channel('events-channel')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, function(payload) {
            drawEventMarker(payload.new);
          })
          .subscribe();
      }
    }, 100);

    // ============================================================
    // 9. ЛЕГЕНДА
    // ============================================================
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      var div = L.DomUtil.create('div', 'info legend');

      var html = '<h4>Зоны контроля</h4>';
      html += '<div><i style="background:#cc0000;"></i> Территория, занимаемая РФ</div>';
      html += '<div><i style="background:#0055cc;"></i> Контроль Украины</div>';
      html += '<div><span class="legend-line" style="background:#0088cc;"></span> Контрнаступления ВСУ</div>';

      html += '<hr>';
      html += '<h4>Типы событий</h4>';
      for (var key in CATEGORIES) {
        if (CATEGORIES.hasOwnProperty(key)) {
          var c = CATEGORIES[key];
          html += '<div><i style="background:' + c.color + '; border-radius:50%;"></i> ' + c.label + '</div>';
        }
      }

      html += '<hr>';
      html += '<div style="font-size:11px;color:#888;">Данные: ISW, War-Tracker</div>';

      div.innerHTML = html;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
